[package]
name = "omni-esp32s3-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[[bin]]
name = "omni-esp32s3-probe"
path = "src/main.rs"

[dependencies]
esp-hal = { version = "=1.2.2", features = ["esp32s3", "unstable"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.20.0", features = [
    "esp32s3",
    "panic-handler",
    "println",
] }
esp-println = { version = "0.18.0", default-features = false, features = [
    "esp32s3",
    "jtag-serial",
    "critical-section",
] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
