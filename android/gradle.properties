org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Let Gradle toolchains discover the JDK from environment-provided locations.
org.gradle.java.installations.fromEnv=JAVA_HOME,JAVA_HOME_21_X64,JAVA_HOME_17_X64
# Built-in Kotlin is used from AGP 9 on; only `android.newDsl=false` is still
# required, because the Flutter Gradle plugin needs the legacy DSL types.
android.builtInKotlin=true
android.newDsl=false
