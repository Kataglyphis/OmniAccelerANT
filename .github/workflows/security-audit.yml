name: Security audit

# The hub's lockfile audit: push and PR fail on a new HIGH or CRITICAL advisory, the weekly run and dispatch report every one.

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  schedule:
    - cron: "45 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    uses: Kataglyphis/ANTfrastructure/.github/workflows/security-audit.yml@develop
