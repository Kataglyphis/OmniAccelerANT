# The architecture-independent lint gates (for both arches) and the x64 build; the steps live in reusable-linux.yml.

name: Linux x64 · build + test

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

# Its own group, so neither architecture cancels the other.
concurrency:
  group: linux-x64-${{ github.ref }}
  cancel-in-progress: true

# Read-only: the ghcr login and the FTP deploy use their own secrets, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  # Arch-independent, so graded once and on the bare runner; ratchets: true must match the wrapper's --ratchets.
  lint:
    uses: Kataglyphis/ANTfrastructure/.github/workflows/lint-gates.yml@develop
    with:
      # Restated: the secret scan reads the whole tree, submodules included.
      submodules: recursive
      ratchets: true

  # PowerShell twin of the drift gate; its own job because no hub Linux image ships pwsh, and no -Ignore while the manifest exists.
  shared-config:
    name: shared tool config matches ANTfrastructure (PowerShell twin)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # Top-level submodules suffice: every compared asset lives in third_party/ANTfrastructure.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
          fetch-depth: 1

      - name: Shared tool config matches ANTfrastructure (Sync-SharedConfig -Check)
        run: >-
          pwsh -File third_party/ANTfrastructure/shared/config/Sync-SharedConfig.ps1
          -RepoRoot .
          -Check

  # No needs: on lint, so a finding cannot skip the tests; keep `with:` flat `key: value` lines for Invoke-LinuxLane.ps1 -CheckParity.
  build:
    permissions:
      contents: read
      # reusable-linux.yml's compiler-cache-save deletes its key's older entries.
      actions: write
    uses: ./.github/workflows/reusable-linux.yml
    with:
      runner: ubuntu-26.04
      arch: x64
      platform: linux/amd64
      build-mode: release
      app-name: omni-accelerant
      flutter-dir: /opt/flutter
      package-formats: tar,deb,flatpak,appimage
      install-packaging-deps: true
      # x64 builds the API docs and, on a push, deploys them; one copy is enough.
      run-docs: true
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      SERVER: ${{ secrets.SERVER }}
      USERNAME: ${{ secrets.USERNAME }}
      PW: ${{ secrets.PW }}
