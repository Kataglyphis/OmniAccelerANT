# The architecture-independent lint gates (for both arches) and the x64 build; the steps live in reusable-linux.yml.

name: Linux x64 · build + test

# The one lane every push to develop runs; release.yml calls it on main (third_party/ANTfrastructure/docs/branch-and-release-strategy.md).
on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:
  workflow_call:

# Its own group per caller (github.workflow is the caller's name when called): a push cannot cancel a release run's lane.
concurrency:
  group: linux-x64-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

# Read-only: the ghcr login uses its own secret, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  # Arch-independent, so graded once and on the bare runner; ratchets: true must match the wrapper's --ratchets.
  lint:
    uses: Kataglyphis/ANTfrastructure/.github/workflows/lint-gates.yml@develop
    with:
      # Restated: the secret scan reads the whole tree, submodules included.
      submodules: recursive
      ratchets: true

  # PowerShell twin of the drift gate; its own job because no hub Linux image ships pwsh, and no -Ignore while the manifest exists.
  shared-config:
    name: shared tool config matches ANTfrastructure (PowerShell twin)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # Top-level submodules suffice: every compared asset lives in third_party/ANTfrastructure.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 1

      - name: Shared tool config matches ANTfrastructure (Sync-SharedConfig -Check)
        run: >-
          pwsh -File third_party/ANTfrastructure/shared/config/Sync-SharedConfig.ps1
          -RepoRoot .
          -Check

  # No needs: on lint, so a finding cannot skip the tests; keep `with:` flat `key: value` lines for Invoke-LinuxLane.ps1 -CheckParity.
  build:
    permissions:
      contents: read
      # reusable-linux.yml's compiler-cache-save deletes its key's older entries.
      actions: write
    uses: ./.github/workflows/reusable-linux.yml
    with:
      runner: ubuntu-26.04
      arch: x64
      platform: linux/amd64
      build-mode: release
      app-name: omni-accelerant
      flutter-dir: /opt/flutter
      package-formats: tar,deb,flatpak,appimage
      install-packaging-deps: true
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  # Inside the image every library is present; the bare image base shows a missing one (hub linux-build-basics.md).
  clean-host:
    name: Packages on a clean Ubuntu 26.04 (x64)
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      # 124 is timeout's: the app was still up after 20 s, as the lane's own launch smoke counts it.
      - name: Install and start the .deb and the AppImage
        uses: Kataglyphis/ANTfrastructure/.github/actions/clean-host-package-check@develop
        with:
          artifact: omni-accelerant-linux-x64-packages
          apt-packages: xvfb libgl1-mesa-dri libegl-mesa0
          deb: '*.deb'
          deb-command: rc=0; xvfb-run -a timeout 20 omni-accelerant || rc=$?; test "$rc" -eq 124
          appimage: '*.AppImage'
          appimage-command: rc=0; xvfb-run -a timeout 20 "$APPIMAGE" || rc=$?; test "$rc" -eq 124

      - name: Unpack and start the tarball
        uses: Kataglyphis/ANTfrastructure/.github/actions/clean-host-package-check@develop
        with:
          artifact: omni-accelerant-linux-x64-tar
          tarball: '*.tar.gz'
          tarball-command: rc=0; xvfb-run -a timeout 20 ./omni_accelerant || rc=$?; test "$rc" -eq 124
