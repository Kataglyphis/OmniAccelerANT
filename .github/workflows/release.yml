# Every push to main is a release: every lane once more on that commit, then v<version> only when all are green (third_party/ANTfrastructure/docs/branch-and-release-strategy.md).
name: Release · every lane, then v<version>

on:
  push:
    branches: ["main"]
  # On main: the release again, when the pushed run can no longer be rerun. Elsewhere: a dry run.
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run every lane and collect the release files on this branch, but tag and publish nothing
        type: boolean
        default: false

permissions: {}

# Never two releases at once, and never a cancelled one; a dry run on develop does not hold up main's.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A minute, so a merge without a new version stops before an hour of lanes; elsewhere only a dry run runs.
  version:
    if: github.ref == 'refs/heads/main' || inputs.dry-run
    # The grant covers the publish job of the same file; the check job itself takes contents: read.
    permissions:
      contents: write
    uses: Kataglyphis/ANTfrastructure/.github/workflows/release-publish.yml@develop
    with:
      stage: check
      name: OmniAccelerANT
      version-file: pubspec.yaml
      dry-run: ${{ inputs.dry-run == true }}

  # The same lanes on-request.yml calls, plus linux-x64; each grants what its lane's jobs ask for.
  linux-x64:
    needs: version
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/linux-x64.yml
    secrets: inherit

  linux-arm64:
    needs: version
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/linux-arm64.yml
    secrets: inherit

  windows-x64:
    needs: version
    permissions:
      contents: read
      security-events: write
      # windows-x64.yml prunes its compiler cache's older entries.
      actions: write
    uses: ./.github/workflows/windows-x64.yml
    secrets: inherit

  windows-arm64:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/windows-arm64.yml
    secrets: inherit

  android:
    needs: version
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/android.yml
    secrets: inherit

  web:
    needs: version
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/web.yml
    secrets: inherit

  # needs: every lane, so one red or cancelled lane means no tag and no release.
  release:
    needs: [linux-x64, linux-arm64, windows-x64, windows-arm64, android, web]
    permissions:
      contents: write
    uses: Kataglyphis/ANTfrastructure/.github/workflows/release-publish.yml@develop
    with:
      stage: publish
      name: OmniAccelerANT
      version-file: pubspec.yaml
      dry-run: ${{ inputs.dry-run == true }}
      # Every lane's uploads: the app for each platform and the ObservANT packages the cameras update from.
      collect: |
        --strict
        --skip build-log*
        --skip flutter-build-log-*
        --skip *-debug
        --skip *-natives-*
        --skip gstreamer-ai-web-frontend
        --skip *-test-results
        --skip *-tests
        --include omni-observant-*/*
        --include omni-accelerant-installers-windows-*/*
        --include omni-accelerant-linux-*-packages/*.deb
        --include omni-accelerant-linux-*-packages/*.AppImage
        --rename omni-accelerant-linux-*-packages/*.flatpak=omni-accelerant-{version}-{machine}.flatpak
        --rename omni-accelerant-linux-*-tar/*.tar.gz=omni-accelerant-{version}-linux-{arch}.tar.gz
        --unpack omni-accelerant-apk-*-tar
        --rename omni-accelerant-apk-*-tar/*/app-release.apk=omni-accelerant-{version}-android-arm64-v8a.apk
        --zip windows-release-files=omni-accelerant-{version}-windows-x64.zip
        --zip omni-accelerant-windows-arm64=omni-accelerant-{version}-windows-arm64.zip
        --expect omni-accelerant-{version}-windows-x64.zip
        --expect omni-accelerant-{version}-windows-arm64.zip
        --expect omni-accelerant-{version}-android-arm64-v8a.apk
        --expect omni-accelerant_{version}_amd64.deb
        --expect omni-accelerant_{version}_arm64.deb
        --expect omni-observant_{version}_amd64.deb
        --expect omni-observant_{version}_arm64.deb
        --expect omni-observant-{version}-linux-amd64.tar.gz
        --expect omni-observant-{version}-linux-arm64.tar.gz
        --expect omni-observant-{version}-windows-x64.msi
        --expect omni-observant-{version}-windows-arm64.msi
        --expect omni-accelerant-{version}-windows-x64.msi
        --expect omni-accelerant-{version}-windows-arm64.msi
        --expect omni-accelerant-{version}-windows-x64.msix
        --expect omni-accelerant-{version}-windows-arm64.msix
