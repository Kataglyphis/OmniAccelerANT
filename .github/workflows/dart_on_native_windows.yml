name: Build + test + run on Windows with (clang-cl)

on: [ push, pull_request ]

env:
  BUILD_DIR_RELEASE: build/windows/x64/runner/x64-ClangCL-Windows-Release

defaults:
  run:
    shell: pwsh

jobs:
  build-clang:
    runs-on: windows-2025
    permissions:
      contents: read
      security-events: write

    steps:

      # Why DocumANTation is pruned and why the mount inputs stay unset:
      # AGENTS.md § 4, "The CI lane".
      - name: Prepare Windows container host
        id: prep
        uses: Kataglyphis/ContainerHub/.github/actions/prepare-windows-container-host@main
        with:
          image: ghcr.io/kataglyphis/kataglyphis_beschleuniger:winamd64
          registry-password: ${{ secrets.GHCR_PAT }}
          short-path-target: /d/ws
          exclude-submodules: |
            third_party/DocumANTation

      - name: Run container
        uses: Kataglyphis/ContainerHub/.github/actions/run-in-windows-container@main
        with:
          image: ghcr.io/kataglyphis/kataglyphis_beschleuniger:winamd64
          file: C:\ws\scripts\windows\Build-Windows.ps1
          file-args: |
            -SkipMsixPackaging

      # Absolute under the short-path clone, never relative - AGENTS.md § 4.
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-release-files
          if-no-files-found: error
          path: |
            ${{ steps.prep.outputs.workspace }}/${{ env.BUILD_DIR_RELEASE }}/**/*

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-log
          path: |
            ${{ steps.prep.outputs.workspace }}/logs/build-windows-*.log
            ${{ steps.prep.outputs.workspace }}/logs/build-summary-*.json

      - name: Upload CodeQL SARIF
        if: always()
        uses: Kataglyphis/ContainerHub/.github/actions/upload-codeql-sarif@main
        with:
          workspace: ${{ steps.prep.outputs.workspace }}
          category: windows-clang-rust
