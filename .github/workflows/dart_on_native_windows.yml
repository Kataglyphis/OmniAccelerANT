name: Build + test + run on Windows with (clang-cl)

on: [ push, pull_request ]

env:
  BUILD_DIR_RELEASE: build/windows/x64/runner/x64-ClangCL-Windows-Release

defaults:
  run:
    shell: pwsh

jobs:
  build-clang:
    runs-on: windows-2025
    permissions:
      contents: read
      security-events: write

    steps:

      # Why DocumANTation is pruned and why the mount inputs stay unset:
      # AGENTS.md § 4, "The CI lane".
      #
      # `image:` is DELIBERATELY ABSENT, here and on the run step below. The
      # family image ref has exactly one owner - IMAGE_REGISTRY_PREFIX +
      # CI_IMAGE_WINDOWS_TAG in ContainerHub's
      # linux/scripts/01-core/versions.env - and both composite actions carry
      # that composed ref as the `image` input default, checked against
      # versions.env by linux/scripts/verify_ci_image_refs.py. Omitting the
      # input is how this lane inherits it; writing :winamd64 out again here
      # and once more below would be two copies no gate compares to the first.
      - name: Prepare Windows container host
        id: prep
        uses: Kataglyphis/ContainerHub/.github/actions/prepare-windows-container-host@main
        with:
          registry-password: ${{ secrets.GHCR_PAT }}
          short-path-target: /d/ws
          exclude-submodules: |
            third_party/DocumANTation

      # PowerShell parse gate, on the HOST, before the container build starts.
      # Build-Windows.ps1 is 723 lines and runs INSIDE the container, so a bare
      # syntax error in it is currently discovered only once docker has pulled
      # ~54 GB and reached that RUN. Invoke-Lint.ps1's first pass is
      # [Parser]::ParseFile over every script plus the AST traps
      # (comma-attribute quoting, [switch] shadowing, glued parameter tokens);
      # PSScriptAnalyzer runs as its advisory second pass, which is the script's
      # own default - `-FailOnAnalyzer` is a separate, deliberate decision and is
      # not being smuggled in here.
      #
      # working-directory is ABSOLUTELY LOAD-BEARING. `short-path-target: /d/ws`
      # above means prepare-windows-container-host's own actions/checkout takes
      # NO submodules; the complete tree - third_party/ContainerHub, and so this
      # very script - exists only under the short-path clone the action reports
      # as steps.prep.outputs.workspace (D:\ws). Run this from the default
      # ${{ github.workspace }} instead and `pwsh -File` cannot even find
      # Invoke-Lint.ps1; wire it against a tree that DOES have the hub but not
      # this repo's scripts and it reports green over nothing. Same rule as the
      # artifact paths below.
      #
      # -Path scripts is this repo's OWN PowerShell (scripts/windows/*.ps1,
      # scripts/windows/modules/*.psm1, scripts/linux/Invoke-LinuxLane.ps1) and
      # deliberately excludes rust_builder/cargokit/cmake/resolve_symlinks.ps1,
      # vendored upstream code AGENTS.md § 4 already exempts from the CMake
      # format gate for the same reason. The PSScriptAnalyzer ruleset is NOT
      # copied here: Invoke-Lint.ps1 resolves it against its own $PSScriptRoot,
      # so the hub hands it over by reference.
      - name: Lint PowerShell (parse + AST traps)
        working-directory: ${{ steps.prep.outputs.workspace }}
        run: >-
          pwsh -File third_party/ContainerHub/windows/scripts/Invoke-Lint.ps1
          -Path scripts

      - name: Run container
        uses: Kataglyphis/ContainerHub/.github/actions/run-in-windows-container@main
        with:
          file: C:\ws\scripts\windows\Build-Windows.ps1
          file-args: |
            -SkipMsixPackaging

      # Absolute under the short-path clone, never relative - AGENTS.md § 4.
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-release-files
          if-no-files-found: error
          path: |
            ${{ steps.prep.outputs.workspace }}/${{ env.BUILD_DIR_RELEASE }}/**/*

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-log
          path: |
            ${{ steps.prep.outputs.workspace }}/logs/build-windows-*.log
            ${{ steps.prep.outputs.workspace }}/logs/build-summary-*.json

      # NOTE, and it is a real gap rather than a defect introduced here: this
      # step probes <workspace>/codeql-results and today that directory is
      # never written. Build-Windows.ps1 runs Invoke-BuildCodeQL only under
      # `if ($CodeQL)`, and the file-args above pass only -SkipMsixPackaging,
      # so the probe reports found=false and the upload silently no-ops on
      # every run. Unlike the native Linux lane - where the flow has no CodeQL
      # implementation at all and the dead step was therefore deleted - the
      # capability EXISTS here and only needs `-CodeQL` added to file-args.
      # That is a cost decision about the Windows lane's runtime, so it is left
      # to the owner rather than switched on from here. Until it is switched
      # on, this lane contributes nothing to Code Scanning.
      - name: Upload CodeQL SARIF
        if: always()
        uses: Kataglyphis/ContainerHub/.github/actions/upload-codeql-sarif@main
        with:
          workspace: ${{ steps.prep.outputs.workspace }}
          category: windows-clang-rust
