name: Build + test + run on Windows with (clang-cl)

on: [ push, pull_request ]

env:
  BUILD_DIR_RELEASE: build/windows/x64/runner/x64-ClangCL-Windows-Release

defaults:
  run:
    shell: pwsh

jobs:
  build-clang:
    runs-on: windows-2025
    permissions:
      contents: read
      security-events: write

    steps:

      # The runner workspace is D:\a\<repo>\<repo> - the repository name twice,
      # ~71 characters before any content. Add this repo's submodule chain
      # (ContainerHub -> DocumANTation -> md2pdfLib -> latex/awesome-beamer) and
      # the .git/modules/... paths pass 260 characters, so a recursive checkout
      # dies before any build step runs:
      #
      #   cannot write keep file '...\latex\awesome-beamer\objects\pack\pack-*.keep':
      #     Filename too long
      #   clone of 'https://github.com/Kataglyphis/awesome-beamer' into submodule
      #     path '...' failed
      #
      # core.longpaths does NOT reliably cover those child clones, which is why
      # the line that used to sit here (commented out) was never the fix. Check
      # out WITHOUT submodules, then clone the whole tree into a SHORT path where
      # the same chain fits - the pattern Kataglyphis-BeschleunigerBallett and
      # Kataglyphis-RustProjectTemplate already use.
      - name: Checkout repository (no submodules; see the short-path clone below)
        uses: actions/checkout@v6.0.2
        with:
            fetch-depth: 1
            submodules: false

      # ContainerHub owns this, including the SSH -> token-HTTPS rewrite a hosted
      # runner needs (.gitmodules pins git@github.com: and there is no SSH key).
      # D:\ws is also what run-in-windows-container mounts by default.
      - name: Clone full tree with submodules into a short path (D:\ws)
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/clone-into-short-path@main
        with:
          target: /d/ws
          token: ${{ github.token }}

      # The winamd64 image is ~54 GB to import and Docker keeps its data-root on
      # the SYSTEM drive. Measured on a windows-2025 runner 2026-08-11:
      #   C: 29.9 GB free of 149.4 | D: 219.5 GB free of 220.0
      # Pointing the data-root at D: puts the image where the space is, instead of
      # deleting Visual Studio off C: to make room. MUST precede the pull.
      - name: 'Put the Docker data-root on D:'
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/set-docker-data-root@main
        with:
          data-root: 'D:\docker'
      # my windows container is quite big ... so remove runner packages for enough
      # dis space. ContainerHub owns this action — its copy deletes with
      # `rmdir /s /q` (minutes instead of tens of minutes on hostedtoolcache)
      # and reports free space before and after.
      - name: Cleanup disk space
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/cleanup-disk-space@main

      - name: Login to GitHub
        uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: Kataglyphis
          password: ${{ secrets.GHCR_PAT }}

      - name: Pull image
        run: |
          docker pull ghcr.io/kataglyphis/kataglyphis_beschleuniger:winamd64

      # -CodeQL turns on analysis
      # for now disabled due to long runtimes
      #
      # ContainerHub's action instead of a hand-rolled `docker run`: it gives
      # the container every logical processor the runner has (the old `--cpus 4`
      # throttled the build on bigger runners), delivers the payload through env
      # vars so nothing is re-parsed by the host shell, and runs it under `pwsh`
      # — which the build script now requires, since every ContainerHub module
      # declares `#requires -Version 7.0` and Windows PowerShell 5.1 cannot load
      # them.
      #
      # mount-source/mount-target are deliberately NOT set: the action already
      # defaults to D:\ws -> C:\ws, which is where the short-path clone put the
      # tree. Setting them back to github.workspace would mount the
      # submodule-less checkout instead.
      - name: Run container
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/run-in-windows-container@main
        with:
          image: ghcr.io/kataglyphis/kataglyphis_beschleuniger:winamd64
          file: C:\ws\scripts\windows\Build-Windows.ps1
          file-args: |
            -SkipMsixPackaging

      # Artifact paths are ABSOLUTE under D:\ws now, not relative to
      # github.workspace: the build runs in the short-path clone, so that is
      # where its output lands. A relative path here would silently match
      # nothing in the submodule-less checkout - and `if-no-files-found: error`
      # would report it as a missing build rather than a wrong path.
      # see also the install commands in the bottom of the CMakeLists.txt
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-release-files
          if-no-files-found: error
          path: |
            D:/ws/${{ env.BUILD_DIR_RELEASE }}/**/*

      # The build script already tees its own transcript plus a machine-readable
      # summary into logs/ inside the mounted workspace, so there is no separate
      # build.log to keep in sync.
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-log
          path: |
            D:/ws/logs/build-windows-*.log
            D:/ws/logs/build-summary-*.json

      - uses: github/codeql-action/upload-sarif@v4 # Recommended upgrade
        if: hashFiles('D:/ws/codeql-results/*.sarif') != ''
        with:
          sarif_file: D:/ws/codeql-results # Points to the folder containing cpp.sarif and rust.sarif
          category: windows-clang-rust
