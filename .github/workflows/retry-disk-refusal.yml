# Re-runs only a job prepare-linux-ci-host refused for disk. See third_party/ANTfrastructure/.github/actions/README.md#retry-disk-refusal
name: CI · retry a runner disk refusal

on:
  workflow_run:
    workflows:
      - "Linux x64 · build + test"
      - "Web · build + test"
      - "Docs · build + publish"
      - "Android · build + test"
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: read

jobs:
  retry:
    name: Re-run a job refused for disk
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: Kataglyphis/ANTfrastructure/.github/actions/retry-disk-refusal@develop
