# .github/workflows/submodule-pins.yml
#
# Asserts that every submodule checkout sits at the commit this repository has
# RECORDED for it, and that the recorded commit is reachable from the
# submodule's remote.
#
# Why it matters more here than almost anywhere else: OmniAccelerANT has four
# submodules and three of them (ANTfrastructure, OxidANT, AccelerANTgine) are
# owned and fast-moving, so a working tree that has quietly walked forward from
# its gitlink is compiling something other than what is committed - and `git
# submodule status` marks that only with a '+' that is easy to miss. The
# reachability half catches the other direction: a gitlink bumped to a commit
# that was never pushed builds on the machine that made it and on no other.
#
# THE LANE IS ANTfrastructure'S, called with `uses:` since 2026-09-15.
# Everything this file used to spell out - the windows-2025 runner, the Pester
# 3.4.0 dialect, the `submodules: true` checkout, the suite path and the
# ANTFRASTRUCTURE_PIN_CHECK_REPO_ROOT wiring - is a fact about the SUITE, not
# about this repository, and three consumers each carried their own copy of it.
# What is left here is what is genuinely this repo's: when the lane runs.
#
# The one input restated rather than defaulted is pester-version. It is this
# consumer saying which dialect the lane was measured against (5.7.1 passes but
# prints nothing on a red run; 6.1.0 rejects -Quiet before a test executes)
# rather than inheriting a default the hub may change under a green build.
name: Submodule pins

on:
  push:
    branches: ["main", "develop"]
    paths:
      - '.gitmodules'
      - 'third_party/**'
      - '.github/workflows/submodule-pins.yml'
  pull_request:
    branches: ["main", "develop"]
    paths:
      - '.gitmodules'
      - 'third_party/**'
      - '.github/workflows/submodule-pins.yml'

permissions:
  contents: read

concurrency:
  group: submodule-pins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins:
    uses: Kataglyphis/ANTfrastructure/.github/workflows/submodule-pins.yml@develop
    with:
      pester-version: '3.4.0'
