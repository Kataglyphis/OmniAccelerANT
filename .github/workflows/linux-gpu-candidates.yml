name: Linux GPU candidates (unverified)

on:
  workflow_dispatch:
    inputs:
      gpu-tuple:
        description: GPU candidate combination to build and check
        type: choice
        options: [all, nvidia-x64, nvidia-arm64, amd-x64]
        default: all
      caller-scope:
        description: Lowercase artifact scope; use distinct scopes for calls in one run
        type: string
        default: default
  workflow_call:
    inputs:
      gpu-tuple:
        type: string
        default: all
      caller-scope:
        type: string
        default: default
    secrets:
      GHCR_PAT:
        required: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      repository: ${{ steps.pins.outputs.repository }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      selection: ${{ steps.matrix.outputs.selection }}
      scope: ${{ steps.matrix.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Test candidate contracts
        run: python3 scripts/linux/tests/test-gpu-candidate-preflight.py
      - name: Test packaged CPU runtime verification
        run: bash scripts/linux/tests/test-check-packaged-onnx-runtime.sh
      - name: Test bridge regeneration safeguards
        run: |
          bash scripts/linux/tests/test-frb-codegen-preflight.sh
          python3 scripts/linux/tests/test-frb-codegen-real-git.py
      - name: Test locked model containment
        run: python3 -I scripts/windows/tests/test_verify_detector_model.py
      - name: Check recorded GPU dependency capabilities before pulling images
        id: pins
        run: |
          repository="$(python3 scripts/linux/preflight-gpu-candidate.py)"
          printf 'repository=%s\n' "$repository" >> "$GITHUB_OUTPUT"
      - name: Test finished-package GPU verifier
        run: bash scripts/linux/tests/test-verify-gpu-candidate.sh
      - name: Select supported GPU candidates
        id: matrix
        env:
          GPU_TUPLE: ${{ inputs.gpu-tuple }}
          CALLER_SCOPE: ${{ inputs.caller-scope }}
        run: |
          set -euo pipefail
          matrix="$(python3 scripts/linux/preflight-gpu-candidate.py --matrix "$GPU_TUPLE")"
          scope="$(python3 scripts/linux/preflight-gpu-candidate.py --scope "$CALLER_SCOPE")"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          printf 'selection=%s\nscope=%s\n' "$GPU_TUPLE" "$scope" >> "$GITHUB_OUTPUT"

  candidate:
    needs: preflight
    name: Unverified ${{ matrix.vendor }} ${{ matrix.arch }} candidate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    concurrency:
      group: omni-linux-gpu-${{ github.ref }}-${{ github.workflow }}-${{ needs.preflight.outputs.selection }}-${{ needs.preflight.outputs.scope }}-${{ matrix.vendor }}-${{ matrix.arch }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - name: Prepare host and pull the registry GPU image
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          image: ${{ format('{0}:{1}', needs.preflight.outputs.repository, matrix.image-tag) }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}
          fetch-depth: '1'
          submodules: recursive
          free-disk-space: 'true'
          pull-first: 'false'
          max-concurrent-downloads: '10'
      - name: Build, CPU-smoke and verify finished candidate payloads
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          image: ${{ format('{0}:{1}', needs.preflight.outputs.repository, matrix.image-tag) }}
          extra-args: >-
            --privileged --platform "${{ matrix.platform }}" -e CI=true
            -e KATAGLYPHIS_ORT_PROVIDER=${{ matrix.provider }}
            -e ORT_LIB_LOCATION=/usr/local/lib/onnxruntime-gpu/lib
          script: >-
            bash -lc 'bash scripts/linux/check-gpu-image-runtime.sh "${{ matrix.provider }}"
            && bash scripts/linux/ci/ci-container-run-native-linux.sh
            --arch "${{ matrix.arch }}" --build-mode release --flutter-dir /opt/flutter
            --app-name omni-accelerant --package-formats tar,deb,appimage
            --install-packaging-deps false --strict-checks true --run-codeql false --run-docs false
            && bash scripts/linux/verify-gpu-candidate.sh "${{ matrix.vendor }}" "${{ matrix.arch }}"'
      - name: Upload unverified GPU candidates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unverified-omni-${{ matrix.vendor }}-linux-${{ matrix.arch }}-${{ needs.preflight.outputs.selection }}-${{ needs.preflight.outputs.scope }}-attempt-${{ github.run_attempt }}
          overwrite: false
          path: |
            out/omni-accelerant-${{ matrix.vendor }}-linux-${{ matrix.arch }}.tar.gz
            out/omni-accelerant-${{ matrix.vendor }}_*.deb
            out/omni-accelerant-${{ matrix.vendor }}-*.AppImage
          if-no-files-found: error

  clean-host:
    name: Clean-host CPU inference (${{ matrix.vendor }}, ${{ matrix.arch }})
    needs: [preflight, candidate]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && (needs.candidate.result == 'success' || needs.candidate.result == 'failure') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # GPU provider libraries deliberately depend on the host SDK; scan the CPU launch instead.
      - name: Run model inference and start each candidate with CPU selected
        uses: Kataglyphis/ANTfrastructure/.github/actions/clean-host-package-check@develop
        with:
          artifact: unverified-omni-${{ matrix.vendor }}-linux-${{ matrix.arch }}-${{ needs.preflight.outputs.selection }}-${{ needs.preflight.outputs.scope }}-attempt-${{ github.run_attempt }}
          scan-elves: 'false'
          apt-packages: xvfb libgl1-mesa-dri libegl-mesa0
          deb: '*.deb'
          deb-command: bash "$GITHUB_WORKSPACE/scripts/linux/check-packaged-onnx-runtime.sh" bundle "/opt/omni-accelerant-${{ matrix.vendor }}" && { rc=0; env -u KATAGLYPHIS_ONNX_MODEL -u ORT_DYLIB_PATH -u ORT_LIB_LOCATION -u ONNX_ROOT -u LD_LIBRARY_PATH KATAGLYPHIS_ORT_DEVICE=cpu KATAGLYPHIS_ONNX_BACKEND=ort xvfb-run -a timeout 20 omni-accelerant-${{ matrix.vendor }} || rc=$?; test "$rc" -eq 124; }
          tarball: '*.tar.gz'
          tarball-command: bash "$GITHUB_WORKSPACE/scripts/linux/check-packaged-onnx-runtime.sh" bundle . && { rc=0; env -u KATAGLYPHIS_ONNX_MODEL -u ORT_DYLIB_PATH -u ORT_LIB_LOCATION -u ONNX_ROOT -u LD_LIBRARY_PATH KATAGLYPHIS_ORT_DEVICE=cpu KATAGLYPHIS_ONNX_BACKEND=ort xvfb-run -a timeout 20 ./omni_accelerant || rc=$?; test "$rc" -eq 124; }
          appimage: '*.AppImage'
          appimage-command: bash "$GITHUB_WORKSPACE/scripts/linux/check-packaged-onnx-runtime.sh" appimage "$APPIMAGE" "omni-accelerant-${{ matrix.vendor }}" && { rc=0; env -u KATAGLYPHIS_ONNX_MODEL -u ORT_DYLIB_PATH -u ORT_LIB_LOCATION -u ONNX_ROOT -u LD_LIBRARY_PATH KATAGLYPHIS_ORT_DEVICE=cpu KATAGLYPHIS_ONNX_BACKEND=ort xvfb-run -a timeout 20 "$APPIMAGE" || rc=$?; test "$rc" -eq 124; }
