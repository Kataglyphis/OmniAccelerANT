# The clang-cl container build (the same Build-Windows.ps1 a local run uses), its runner tested on the host, and the ORT glue suite.
name: Windows x64 · build + test

# On request only (third_party/ANTfrastructure/docs/branch-and-release-strategy.md): on-request.yml, release.yml or by hand.
on:
  workflow_dispatch:
  workflow_call:

# Per lane and caller: stacked Windows builds learn the same thing twice, but a release run's must not die for a request.
concurrency:
  group: windows-x64-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  BUILD_DIR_RELEASE: build/windows/x64/runner/x64-ClangCL-Windows-Release
  BUILD_DIR_DEBUG: build/windows/x64/runner/x64-ClangCL-Windows-Debug

defaults:
  run:
    shell: pwsh

jobs:
  # A key keeps one entry: the save above stores a new one per run.
  prune-compiler-cache:
    name: Prune the compiler cache
    needs: build-clang
    if: ${{ always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete the x64-windows entries of older runs
        uses: Kataglyphis/ANTfrastructure/.github/actions/compiler-cache-prune@develop
        with:
          key: x64-windows
          # A run whose version gate saved nothing must not delete the entries an earlier run did save.
          require-saved: 'true'

  build-clang:
    runs-on: windows-2025
    # Three times the slowest green run (~58 min with the ~54 GB pull), so a hang never reaches the 6 h default.
    timeout-minutes: 180
    permissions:
      contents: read
      security-events: write

    steps:

      # DocumANTation pruning and unset mounts: AGENTS.md § 5, "The CI lane"; no `image:`, the actions default it.
      - name: Prepare Windows container host
        id: prep
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-windows-container-host@develop
        with:
          registry-password: ${{ secrets.GHCR_PAT }}
          short-path-target: /d/ws
          exclude-submodules: |
            third_party/DocumANTation

      # On the host, before the ~54 GB pull; only the short-path clone has submodules, hence working-directory.
      - name: Lint PowerShell (parse + AST traps)
        working-directory: ${{ steps.prep.outputs.workspace }}
        run: >-
          pwsh -File third_party/ANTfrastructure/windows/scripts/Invoke-Lint.ps1
          -Path scripts

      # sccache's cache across runs. Build-Windows.ps1 uses it only on an sccache with mozilla/sccache#2876, and develop saves it.
      - name: Restore compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.prep.outputs.workspace }}\.ci-cache
          key: compiler-cache-x64-windows-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: compiler-cache-x64-windows-

      # Present on a miss too, so the build can fill it for the save.
      - name: Compiler cache directory
        run: New-Item -ItemType Directory -Force -Path '${{ steps.prep.outputs.workspace }}\.ci-cache' | Out-Null

      - name: Run container
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-windows-container@develop
        with:
          file: C:\ws\scripts\windows\Build-Windows.ps1
          file-args: |
            -SkipMsixPackaging
          extra-args: |
            --env
            CI_COMPILER_CACHE=C:\ws\.ci-cache
            --env
            SCCACHE_CACHE_SIZE=2500M

      # Only what the version gate let the build fill; an image with an older sccache leaves .ci-cache empty.
      - name: Save compiler cache
        if: >-
          ${{ always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          && hashFiles(format('{0}/.ci-cache/sccache/**', steps.prep.outputs.workspace)) != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.prep.outputs.workspace }}\.ci-cache
          key: compiler-cache-x64-windows-${{ github.run_id }}-${{ github.run_attempt }}

      # Absolute under the short-path clone, never relative - AGENTS.md § 5.
      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-files
          if-no-files-found: error
          path: |
            ${{ steps.prep.outputs.workspace }}/${{ env.BUILD_DIR_RELEASE }}/**/*

      # On the host, outside the image, as on a user's machine; the arm64 lane runs the same scripts.
      - name: Plugin C ABI (x64)
        working-directory: ${{ steps.prep.outputs.workspace }}
        run: >-
          & ./scripts/windows/Test-KntAbi.ps1
          -PluginDll "$env:BUILD_DIR_RELEASE/kataglyphis_native_inference_plugin.dll"

      # Built in the image by Build-Windows.ps1, run here: flutter_windows.dll does not load in Server Core (0xC0000135).
      - name: Plugin gtest (x64)
        working-directory: ${{ steps.prep.outputs.workspace }}
        run: >-
          & ./scripts/windows/Invoke-PluginGTest.ps1 -BuildDir build/windows/x64
          -RuntimeDir $env:BUILD_DIR_RELEASE

      # Standalone: the runner ships without the image's PATH, so every import must resolve inside it.
      - name: Arch gate + import walk (the x64 runner)
        working-directory: ${{ steps.prep.outputs.workspace }}
        run: >-
          & ./third_party/ANTfrastructure/windows/scripts/build/Test-TargetArch.ps1
          -Path $env:BUILD_DIR_RELEASE -Arch amd64 -MinInspected 50 -ImportWalk -Standalone

      # G6 re-proves the stamped chain ORT first; no -SearchPath, so the app starts as a double-click starts it.
      - name: Launch smoke (x64)
        working-directory: ${{ steps.prep.outputs.workspace }}
        run: >-
          & ./scripts/windows/Test-LaunchSmoke.ps1
          -AppDir $env:BUILD_DIR_RELEASE -OrtStamp

      # The runner images ship no .NET SDK; WiX 7 is a net8.0 dotnet tool that rolls forward to any newer one.
      - name: .NET for WiX
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # WiX 7.0.0, as the image pins it (the hub's Install-ScoopTools.ps1); the owner accepted wix7's EULA on 2026-10-01.
      - name: WiX for the installers
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $wix = Join-Path $env:RUNNER_TEMP 'wix'
          dotnet tool install --tool-path $wix wix --version 7.0.0
          & (Join-Path $wix 'wix.exe') eula accept wix7
          & (Join-Path $wix 'wix.exe') extension add --global WixToolset.UI.wixext/7.0.0
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "WIX=$wix"

      - name: Package the app (MSI, MSIX)
        working-directory: ${{ steps.prep.outputs.workspace }}
        run: '& ./scripts/windows/Package-OmniAccelerANT.ps1 -AppDir $env:BUILD_DIR_RELEASE -Arch x64 -OutDir out'

      # As a user does: msiexec and Add-AppxPackage, the app started from each install, then both removed.
      - name: Install, start and remove the MSI and the MSIX (x64)
        working-directory: ${{ steps.prep.outputs.workspace }}
        run: |
          & ./scripts/windows/Test-OmniAccelerANTInstallers.ps1 -Msi out/omni-accelerant-*-windows-x64.msi -Msix out/omni-accelerant-*-windows-x64.msix -Arch x64
          if ($LASTEXITCODE) { throw "$LASTEXITCODE installer check(s) failed" }

      - name: Upload the installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omni-accelerant-installers-windows-x64
          if-no-files-found: error
          path: |
            ${{ steps.prep.outputs.workspace }}/out/omni-accelerant-*-windows-x64.msi
            ${{ steps.prep.outputs.workspace }}/out/omni-accelerant-*-windows-x64.msix
            ${{ steps.prep.outputs.workspace }}/out/omni-accelerant-*-windows-x64-testcert.cer

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-log
          path: |
            ${{ steps.prep.outputs.workspace }}/logs/build-windows-*.log
            ${{ steps.prep.outputs.workspace }}/logs/build-summary-*.json
          # The script opens its log at start, so an empty upload means it never ran.
          if-no-files-found: error

      # No-op until file-args pass -CodeQL: only that writes codeql-results/.
      - name: Upload CodeQL SARIF
        if: always()
        uses: Kataglyphis/ANTfrastructure/.github/actions/upload-codeql-sarif@develop
        with:
          workspace: ${{ steps.prep.outputs.workspace }}
          category: windows-clang-rust

  # The Debug preset links ASan+UBSan; the Release job above keeps the lane's gates, this one proves the instrumented runner starts.
  build-clang-debug:
    runs-on: windows-2025
    timeout-minutes: 180
    permissions:
      contents: read

    steps:

      # DocumANTation pruning and unset mounts: AGENTS.md § 5, "The CI lane"; no `image:`, the actions default it.
      - name: Prepare Windows container host
        id: prep
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-windows-container-host@develop
        with:
          registry-password: ${{ secrets.GHCR_PAT }}
          short-path-target: /d/ws
          exclude-submodules: |
            third_party/DocumANTation

      # One container builds both Debug apps on one tree; the plain one is kept as BUILD_DIR_DEBUG-app.
      - name: Run container (Debug, ASan + UBSan, and its integration twin)
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-windows-container@develop
        with:
          file: C:\ws\scripts\windows\Build-WindowsDebugApps.ps1

      - name: Launch smoke (x64, Debug/ASan)
        working-directory: ${{ steps.prep.outputs.workspace }}
        run: >-
          & ./scripts/windows/Test-LaunchSmoke.ps1
          -AppDir "${env:BUILD_DIR_DEBUG}-app" -OrtStamp

      # No Flutter SDK on the runner; the image's version, cloned as the arm64 lane does.
      - name: Flutter (the image's version)
        working-directory: ${{ steps.prep.outputs.workspace }}
        run: |
          $line = Select-String -LiteralPath third_party\ANTfrastructure\linux\scripts\01-core\versions.env -Pattern '^FLUTTER_VERSION=' | Select-Object -First 1
          if (-not $line) { throw 'versions.env names no FLUTTER_VERSION' }
          $version = $line.Line.Split('=', 2)[1].Trim()
          $sdk = Join-Path $env:RUNNER_TEMP 'flutter'
          git clone --depth 1 --branch $version https://github.com/flutter/flutter.git $sdk
          if ($LASTEXITCODE) { throw "cloning Flutter $version failed" }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $sdk 'bin')
          & (Join-Path $sdk 'bin\flutter.bat') --version
          if ($LASTEXITCODE) { throw 'flutter --version failed' }

      # flutter test -d windows would build with MSVC; drive the clang-cl app the container built instead.
      - name: Integration test (x64)
        working-directory: ${{ steps.prep.outputs.workspace }}
        run: >-
          & ./scripts/windows/Invoke-WindowsIntegrationTest.ps1
          -AppDir $env:BUILD_DIR_DEBUG

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-log-debug
          path: |
            ${{ steps.prep.outputs.workspace }}/logs/build-windows-*.log
            ${{ steps.prep.outputs.workspace }}/logs/build-summary-*.json
          # The script opens its log at start, so an empty upload means it never ran.
          if-no-files-found: error

  # Byte fixtures, no image, no build; run-pester-suite fails a path that runs no test at all.
  ort-runner-suite:
    name: Runner ONNX Runtime glue (Pester)
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Top-level submodules suffice: the suite imports G6 from the hub via Resolve-BuildModule.ps1.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Pester suite (scripts/windows/tests)
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-pester-suite@develop
        with:
          path: scripts/windows/tests
          version: '3.4.0'
