# The clang-cl container build (the same Build-Windows.ps1 a local run uses), its runner tested on the host, and the ORT glue suite.
name: Windows x64 · build + test

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

# Stacked Windows container builds are the most expensive way to learn the same thing twice.
concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_DIR_RELEASE: build/windows/x64/runner/x64-ClangCL-Windows-Release
  BUILD_DIR_DEBUG: build/windows/x64/runner/x64-ClangCL-Windows-Debug

defaults:
  run:
    shell: pwsh

jobs:
  build-clang:
    runs-on: windows-2025
    # Three times the slowest green run (~58 min with the ~54 GB pull), so a hang never reaches the 6 h default.
    timeout-minutes: 180
    permissions:
      contents: read
      security-events: write

    steps:

      # DocumANTation pruning and unset mounts: AGENTS.md § 5, "The CI lane"; no `image:`, the actions default it.
      - name: Prepare Windows container host
        id: prep
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-windows-container-host@develop
        with:
          registry-password: ${{ secrets.GHCR_PAT }}
          short-path-target: /d/ws
          exclude-submodules: |
            third_party/DocumANTation

      # On the host, before the ~54 GB pull; only the short-path clone has submodules, hence working-directory.
      - name: Lint PowerShell (parse + AST traps)
        working-directory: ${{ steps.prep.outputs.workspace }}
        run: >-
          pwsh -File third_party/ANTfrastructure/windows/scripts/Invoke-Lint.ps1
          -Path scripts

      - name: Run container
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-windows-container@develop
        with:
          file: C:\ws\scripts\windows\Build-Windows.ps1
          file-args: |
            -SkipMsixPackaging

      # Absolute under the short-path clone, never relative - AGENTS.md § 5.
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-release-files
          if-no-files-found: error
          path: |
            ${{ steps.prep.outputs.workspace }}/${{ env.BUILD_DIR_RELEASE }}/**/*

      # On the host, outside the image, as on a user's machine; the arm64 lane runs the same scripts.
      - name: Plugin C ABI (x64)
        working-directory: ${{ steps.prep.outputs.workspace }}
        run: >-
          & ./scripts/windows/Test-KntAbi.ps1
          -PluginDll "$env:BUILD_DIR_RELEASE/kataglyphis_native_inference_plugin.dll"
          -SearchPath "$env:BUILD_DIR_RELEASE/bin"

      # Built in the image by Build-Windows.ps1, run here: flutter_windows.dll does not load in Server Core (0xC0000135).
      - name: Plugin gtest (x64)
        working-directory: ${{ steps.prep.outputs.workspace }}
        run: >-
          & ./scripts/windows/Invoke-PluginGTest.ps1 -BuildDir build/windows/x64
          -RuntimeDir $env:BUILD_DIR_RELEASE, "$env:BUILD_DIR_RELEASE/bin"

      # Standalone: the runner ships without the image's PATH, so every import must resolve inside it.
      - name: Arch gate + import walk (the x64 runner)
        working-directory: ${{ steps.prep.outputs.workspace }}
        run: >-
          & ./third_party/ANTfrastructure/windows/scripts/build/Test-TargetArch.ps1
          -Path $env:BUILD_DIR_RELEASE -Arch amd64 -MinInspected 50 -ImportWalk -Standalone

      # G6 re-proves the stamped chain ORT first, as Start-Windows.ps1 does, which puts runner\bin on PATH too.
      - name: Launch smoke (x64)
        working-directory: ${{ steps.prep.outputs.workspace }}
        run: >-
          & ./scripts/windows/Test-LaunchSmoke.ps1
          -AppDir $env:BUILD_DIR_RELEASE -SearchPath "$env:BUILD_DIR_RELEASE/bin" -OrtStamp

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-log
          path: |
            ${{ steps.prep.outputs.workspace }}/logs/build-windows-*.log
            ${{ steps.prep.outputs.workspace }}/logs/build-summary-*.json
          # The script opens its log at start, so an empty upload means it never ran.
          if-no-files-found: error

      # No-op until file-args pass -CodeQL: only that writes codeql-results/.
      - name: Upload CodeQL SARIF
        if: always()
        uses: Kataglyphis/ANTfrastructure/.github/actions/upload-codeql-sarif@develop
        with:
          workspace: ${{ steps.prep.outputs.workspace }}
          category: windows-clang-rust

  # The Debug preset links ASan+UBSan; the Release job above keeps the lane's gates, this one proves the instrumented runner starts.
  build-clang-debug:
    runs-on: windows-2025
    timeout-minutes: 180
    permissions:
      contents: read

    steps:

      # DocumANTation pruning and unset mounts: AGENTS.md § 5, "The CI lane"; no `image:`, the actions default it.
      - name: Prepare Windows container host
        id: prep
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-windows-container-host@develop
        with:
          registry-password: ${{ secrets.GHCR_PAT }}
          short-path-target: /d/ws
          exclude-submodules: |
            third_party/DocumANTation

      # Format, tests and docs already ran in the Release job; this one is the instrumented build and its launch.
      - name: Run container (Debug, ASan + UBSan)
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-windows-container@develop
        with:
          file: C:\ws\scripts\windows\Build-Windows.ps1
          file-args: |
            -Configurations
            clangcl-debug
            -SkipMsixPackaging
            -SkipFormat
            -SkipDocs

      # The runner image's VS may not carry the ASan component; the image's toolset always does, and it is what the link used.
      - name: Stage the image's ASan runtime beside the Debug runner
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-windows-container@develop
        with:
          file: C:\ws\scripts\windows\Stage-AsanRuntime.ps1
          file-args: |
            -Destination
            C:\ws\build\windows\x64\runner\x64-ClangCL-Windows-Debug

      - name: Launch smoke (x64, Debug/ASan)
        working-directory: ${{ steps.prep.outputs.workspace }}
        run: >-
          & ./scripts/windows/Test-LaunchSmoke.ps1
          -AppDir $env:BUILD_DIR_DEBUG -SearchPath "$env:BUILD_DIR_DEBUG/bin" -OrtStamp

      # The integration app: the same Debug tree, rebuilt with the test as its Dart entrypoint
      # (FLUTTER_TARGET), after the smoke proved the normal bundle.
      - name: Run container (integration target)
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-windows-container@develop
        with:
          file: C:\ws\scripts\windows\Build-Windows.ps1
          file-args: |
            -Configurations
            clangcl-debug
            -FlutterTarget
            integration_test/simple_test.dart
            -SkipMsixPackaging
            -SkipFormat
            -SkipDocs
            -SkipTests

      # No Flutter SDK on the runner; the image's version, cloned as the arm64 lane does.
      - name: Flutter (the image's version)
        working-directory: ${{ steps.prep.outputs.workspace }}
        run: |
          $line = Select-String -LiteralPath third_party\ANTfrastructure\linux\scripts\01-core\versions.env -Pattern '^FLUTTER_VERSION=' | Select-Object -First 1
          if (-not $line) { throw 'versions.env names no FLUTTER_VERSION' }
          $version = $line.Line.Split('=', 2)[1].Trim()
          $sdk = Join-Path $env:RUNNER_TEMP 'flutter'
          git clone --depth 1 --branch $version https://github.com/flutter/flutter.git $sdk
          if ($LASTEXITCODE) { throw "cloning Flutter $version failed" }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $sdk 'bin')
          & (Join-Path $sdk 'bin\flutter.bat') --version
          if ($LASTEXITCODE) { throw 'flutter --version failed' }

      # flutter test -d windows would build with MSVC; drive the clang-cl app the container built instead.
      - name: Integration test (x64)
        working-directory: ${{ steps.prep.outputs.workspace }}
        run: >-
          & ./scripts/windows/Invoke-WindowsIntegrationTest.ps1
          -AppDir $env:BUILD_DIR_DEBUG

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-log-debug
          path: |
            ${{ steps.prep.outputs.workspace }}/logs/build-windows-*.log
            ${{ steps.prep.outputs.workspace }}/logs/build-summary-*.json
          # The script opens its log at start, so an empty upload means it never ran.
          if-no-files-found: error

  # Byte fixtures, no image, no build; run-pester-suite fails a path that runs no test at all.
  ort-runner-suite:
    name: Runner ONNX Runtime glue (Pester)
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Top-level submodules suffice: the suite imports G6 from the hub via Resolve-BuildModule.ps1.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true

      - name: Pester suite (scripts/windows/tests)
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-pester-suite@develop
        with:
          path: scripts/windows/tests
          version: '3.4.0'
