# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build + test + run on Linux natively - x86-64/arm64

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

# Top-level, so every job below inherits it and none can be added without one.
# `build` still restates it next to the note saying why it has no
# security-events scope. Nothing here writes through GITHUB_TOKEN: the ghcr
# login and the FTP deploy both use repository secrets of their own.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Two host-side gate jobs on the GITHUB-HOSTED runner, deliberately NOT inside
  # the container and NOT steps of `build`:
  #
  #   * once, not twice. `build` is a two-row matrix (x64 + arm64) and every one
  #     of these gates is architecture-independent, so folding them into it
  #     would run every one of them twice and tie a lint verdict to whichever
  #     architecture happened to fail first.
  #   * no image pull. Nothing here needs the ~GB cross image, so these report
  #     in about two minutes instead of after the pull.
  #
  # THE BASH HALF IS ANTfrastructure'S LANE, called with `uses:` since
  # 2026-09-15. It was checkout + setup-uv + `bash scripts/linux/run-lint-gates.sh`
  # here, a near-copy of a job seven consumers carried. The wrapper script stays
  # and is still the one command to run before pushing; the two now have to
  # agree, and only the wrapper is reachable from a dev box.
  #
  # Two inputs are passed rather than defaulted:
  #
  #   * submodules: recursive matches the callee's own default and is restated
  #     because it is load-bearing HERE: the secret scan reads the whole tree,
  #     and a half-checked-out submodule would change what it sees between runs.
  #   * ratchets: true, because the freeze files are seeded and committed. Left
  #     off, CI would grade LESS than the dev box does - six gates where
  #     `bash scripts/linux/run-lint-gates.sh --ratchets` runs seven.
  #
  # Neither job carries timeout-minutes: a job that calls a reusable workflow
  # may not have one (the callee's job owns it), and verify_workflow_conventions.py
  # exempts `uses:` jobs for exactly that reason.
  lint:
    uses: Kataglyphis/ANTfrastructure/.github/workflows/lint-gates.yml@main
    with:
      submodules: recursive
      ratchets: true

  # The PowerShell TWIN of the bash `shared-config drift` gate the lane above
  # runs, kept as a job of its own because the reusable lane has no pwsh step
  # and none of the hub's ten Linux images ship pwsh - a step inside the
  # container could only ever die on "pwsh: not found". Both halves are
  # exercised and are required to agree.
  #
  # The asset set comes from .antfrastructure-shared.manifest, three rows:
  # cmake-format, antfrastructure-sh, resolve-build-module. There is no -Ignore
  # here and there must not be: the four names it used to carry (.clang-format,
  # .clang-tidy, gcovr.cfg, .pre-commit-config.yaml) were never TAKEN by this
  # repo in the first place - a Flutter app with no hand-written CMakeLists.txt,
  # no C++ and no Dart pre-commit hooks - so they are absent, not drifted, and
  # ignoring them only hid whether the three real assets still matched.
  # Sync-SharedConfig.ps1 refuses -Ignore while the manifest exists, which is
  # why the step was silently red until 2026-09-14.
  shared-config:
    name: shared tool config matches ANTfrastructure (PowerShell twin)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # Top-level only: the three assets this compares all live in
      # third_party/ANTfrastructure, and nothing here reads the whole tree.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
          fetch-depth: 1

      - name: Shared tool config matches ANTfrastructure (Sync-SharedConfig -Check)
        run: >-
          pwsh -File third_party/ANTfrastructure/shared/config/Sync-SharedConfig.ps1
          -RepoRoot .
          -Check

  build:
    # The gates above are cheap and architecture-independent: no point paying
    # for two container pulls to learn a shell script has a typo.
    needs: [lint, shared-config]
    strategy:
      # fail-fast off so one architecture failing still reports the other's
      # verdict instead of cancelling it mid-run — AGENTS.md § 4. (The older
      # reason recorded here, "the arm64 row cannot pass because the image tag
      # is amd64-only", expired on 2026-09-04 when :latest-cross became a real
      # multi-arch OCI index — AGENTS.md § 4 again.)
      fail-fast: false
      matrix:
        include:
          - runs_on: ubuntu-26.04
            arch: x64
            build_mode: release
            platform: linux/amd64
            app_name: omni-accelerant
            flutter_dir: /opt/flutter
            package_formats: tar,deb,flatpak,appimage
            install_packaging_deps: true
          - runs_on: ubuntu-26.04-arm
            arch: arm64
            build_mode: release
            platform: linux/arm64
            app_name: omni-accelerant
            flutter_dir: /opt/flutter
            package_formats: tar,deb,flatpak,appimage
            install_packaging_deps: true

    runs-on: ${{ matrix.runs_on }}
    # No security-events: the native Linux flow implements no CodeQL scan (see
    # the --run-codeql note on the container step), so nothing in this job
    # writes code-scanning alerts. The scope comes back the day CodeQL does.
    permissions:
      contents: read

    steps:
      # Reclaim disk, check out, log in to ghcr and pull the image with retries
      # — ANTfrastructure's shared prologue, so the retry count and submodule flags
      # cannot drift between this workflow and its siblings. The pull takes no
      # --platform, which is only correct for a multi-arch tag — see the arm64
      # note in AGENTS.md § 4.
      #
      # `image:` is DELIBERATELY ABSENT, here and on the run step below. The
      # family image ref has exactly one owner — IMAGE_REGISTRY_PREFIX +
      # CI_IMAGE_LINUX_TAG in ANTfrastructure's linux/scripts/01-core/versions.env
      # — and both composite actions carry that composed ref as the `image`
      # input default, checked against versions.env by
      # linux/scripts/verify_ci_image_refs.py. Omitting the input is how this
      # lane inherits it; a per-row `container_image` would be two more copies
      # that no gate compares to the first.
      - name: Prepare CI host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@main
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}
          fetch-depth: '1'
          submodules: recursive

      # `-e CI=true` is load-bearing, not decoration. generate-docs.sh ends by
      # chowning the generated doc/api/ tree from the container's root back to
      # the uid that owns the bind-mounted workspace, and that block is guarded
      # by `[[ "${CI:-}" == "true" ]]`. `docker run` inherits nothing from the
      # runner's environment, so the branch never fired and the workflow paid
      # for it with a `sudo chown -R` step of its own — the same work written
      # twice, once in a script and once inline. The script is now the only
      # copy. --strict-checks is still passed explicitly below, so this does
      # not silently switch on resolve_strict_checks' CI default.
      - name: Run container
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          extra-args: --privileged --platform "${{ matrix.platform }}" -e CI=true
          script: >-
            bash /workspace/scripts/linux/ci/ci-container-run-native-linux.sh
            --arch "${{ matrix.arch }}"
            --build-mode "${{ matrix.build_mode }}"
            --flutter-dir "${{ matrix.flutter_dir }}"
            --app-name "${{ matrix.app_name }}"
            --package-formats "${{ matrix.package_formats }}"
            --install-packaging-deps "${{ matrix.install_packaging_deps }}"
            --strict-checks true
            --run-codeql false
            --run-docs "${{ matrix.arch == 'x64' }}"

      # There is no "Upload CodeQL results SARIF" step here, on purpose. The
      # native Linux flow implements no CodeQL scan — ci-container-run-native-linux.sh
      # says so, and now REFUSES --run-codeql true instead of warning and
      # carrying on — so the step that used to sit here could only ever be
      # skipped: its hashFiles('codeql-results/*.sarif') guard never matched,
      # and it carried continue-on-error: true on top of that. A permanently
      # skipped upload reads like coverage and is none. Wire CodeQL into the
      # native flow and this step plus `security-events: write` come back
      # together. The android lane (dart_build_android_app.yml) is the one that
      # really scans today.

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.app_name }}-linux-${{ matrix.arch }}-tar
          path: out/${{ matrix.app_name }}-linux-${{ matrix.arch }}.tar.gz

      - name: Upload Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.app_name }}-linux-${{ matrix.arch }}-packages
          path: |
            out/*.deb
            out/*.AppImage
            out/*.flatpak

      # The hub action, not SamKirkland's directly: it owns the family's FTP
      # pin, the readable/writable proof on the tree and the refusal to sync an
      # empty local-dir over a live site - third_party/ANTfrastructure/docs/ftp-deploys.md.
      # The doc/api/ ownership fixup that used to live here (sudo chown -R plus
      # chmod -R 755) is gone: generate-docs.sh already chowns the tree to the
      # uid that owns the workspace, and `-e CI=true` on the container step
      # above is what makes that branch actually run.
      # push only: a pull_request from a fork gets no secrets, so this step
      # could only ever fail there on an empty password.
      - name: 📂 Sync files to domain
        if: ${{ matrix.arch == 'x64' && github.event_name == 'push' }}
        uses: Kataglyphis/ANTfrastructure/.github/actions/deploy-over-ftp@main
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PW }}
          local-dir: "./doc/api/"
