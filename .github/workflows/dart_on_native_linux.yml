# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build + test + run on Linux natively - x86-64/arm64

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build:
    strategy:
      # The arm64 row currently cannot pass (the image tag is amd64-only), and
      # with the default fail-fast it cancels the x64 row before it finishes —
      # hiding whether the healthy lane is green. See AGENTS.md § 3.
      fail-fast: false
      matrix:
        include:
          - runs_on: ubuntu-24.04
            arch: x64
            build_mode: release
            platform: linux/amd64
            app_name: kataglyphis-inference-engine
            flutter_dir: /opt/flutter
            container_image: ghcr.io/kataglyphis/kataglyphis_beschleuniger:latest-cross
            package_formats: tar,deb,flatpak,appimage
            install_packaging_deps: true
          - runs_on: ubuntu-24.04-arm
            arch: arm64
            build_mode: release
            platform: linux/arm64
            app_name: kataglyphis-inference-engine
            flutter_dir: /opt/flutter
            container_image: ghcr.io/kataglyphis/kataglyphis_beschleuniger:latest-cross
            package_formats: tar,deb,flatpak,appimage
            install_packaging_deps: true

    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
      security-events: write

    steps:
      # Reclaim disk, check out, log in to ghcr and pull the image with retries
      # — ContainerHub's shared prologue, so the retry count and submodule flags
      # cannot drift between this workflow and its siblings. The pull takes no
      # --platform, which is only correct for a multi-arch tag — see the arm64
      # note in AGENTS.md § 3.
      - name: Prepare CI host
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/prepare-linux-ci-host@main
        with:
          image: ${{ matrix.container_image }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}
          fetch-depth: '1'
          submodules: recursive

      - name: Run container
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/run-in-linux-container@main
        with:
          image: ${{ matrix.container_image }}
          # CARGO_HOME: the image sets it to /usr/local/cargo, which is root-owned
          # while the container runs as uid 1001, so every cargo step that WRITES
          # (registry index/cache, flutter_rust_bridge codegen) dies with
          #   error: failed to create directory `/usr/local/cargo/registry/cache/...`
          # Point it somewhere the uid owns, as the sibling Rust lanes already do.
          extra-args: --privileged --platform "${{ matrix.platform }}" -e CARGO_HOME=/tmp/cargo-home --tmpfs /opt/flutter/packages/flutter_tools/.dart_tool:rw,mode=1777
          script: >-
            bash /workspace/scripts/linux/ci/ci-container-run-native-linux.sh
            --arch "${{ matrix.arch }}"
            --build-mode "${{ matrix.build_mode }}"
            --flutter-dir "${{ matrix.flutter_dir }}"
            --app-name "${{ matrix.app_name }}"
            --package-formats "${{ matrix.package_formats }}"
            --install-packaging-deps "${{ matrix.install_packaging_deps }}"
            --install-flutter true
            --strict-checks false
            --run-codeql "${{ matrix.arch == 'x64' }}"
            --run-docs "${{ matrix.arch == 'x64' }}"

      # Upload SARIF to GitHub Code Scanning
      - name: Upload CodeQL results SARIF
        if: ${{ matrix.arch == 'x64' && hashFiles('codeql-results/*.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: codeql-results
      
      - name: Upload artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: ${{ matrix.app_name }}-linux-${{ matrix.arch }}-tar
          path: out/${{ matrix.app_name }}-linux-${{ matrix.arch }}.tar.gz

      - name: Upload Linux packages
        uses: actions/upload-artifact@v6.0.0
        with:
          name: ${{ matrix.app_name }}-linux-${{ matrix.arch }}-packages
          path: |
            out/*.deb
            out/*.AppImage
            out/*.flatpak

      - name: Fix permissions for doc directory
        if: ${{ matrix.arch == 'x64' }}
        run: |
          sudo chown -R $USER:$USER ./doc/api/
          sudo chmod -R 755 ./doc/api/
          ls -la ./doc/api/

      - name: 📂 Sync files to domain
        if: ${{ matrix.arch == 'x64' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PW }}
          local-dir: "./doc/api/"
