# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build + test + run on Linux natively - x86-64/arm64

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  # ---------------------------------------------------------------------------
  # Host-side gates: ContainerHub's shared config drift check, shellcheck,
  # actionlint and the gitleaks secret scan. Its own job on the GITHUB-HOSTED
  # runner, deliberately NOT inside the container and NOT a step of `build`:
  #
  #   * pwsh. Sync-SharedConfig.ps1 is PowerShell and NONE of the hub's ten
  #     Linux images ship pwsh, so a step inside run-in-linux-container could
  #     only ever die on "pwsh: not found". pwsh IS preinstalled on the hosted
  #     ubuntu image, which is the whole reason this runs out here.
  #   * once, not twice. `build` is a two-row matrix (x64 + arm64) and every one
  #     of these gates is architecture-independent, so folding them into it
  #     would double the work and tie a lint verdict to the arm64 row that
  #     AGENTS.md § 3 records as currently unable to pass.
  #   * no image pull. Nothing here needs the ~GB cross image, so this job
  #     reports in about two minutes instead of after the pull.
  #
  # Coverage these add that nothing else here had: `.cmake-format.yaml` is
  # Sync-SharedConfig-managed and AGENTS.md § 4 documents the -Check contract,
  # but until now both gates that touched it only tested that the file EXISTS -
  # it sat at the canonical blob by luck. And this repo holds FTP credentials, a
  # GHCR PAT and Android keystore secrets with no secret gate at all.
  lint:
    name: shared-config + shell + workflow + secret gates
    runs-on: ubuntu-26.04
    steps:
      # recursive, not `true`: Sync-SharedConfig and the three lint scripts all
      # live in third_party/ContainerHub, which is top-level, but the secret
      # scan below reads the whole tree and a half-checked-out submodule would
      # change what it sees between runs.
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          fetch-depth: 1

      # The -Ignore list is the one AGENTS.md § 4 documents and is deliberate,
      # not drift: of the five shared configs this Flutter app carries only
      # .cmake-format.yaml. Passing it as one comma-separated string is correct
      # under `pwsh -File`, where every argument arrives as a plain string - the
      # script splits it itself.
      - name: Shared tool config matches ContainerHub (Sync-SharedConfig -Check)
        run: >-
          pwsh -File third_party/ContainerHub/shared/config/Sync-SharedConfig.ps1
          -RepoRoot .
          -Check
          -Ignore '.clang-format,.clang-tidy,gcovr.cfg,.pre-commit-config.yaml'

      # The file list comes from `git ls-files`, NOT from a glob. A bare
      # `scripts/**/*.sh` does not recurse without `shopt -s globstar`: in this
      # repo it expands to 3 of the 19 tracked scripts, and a gate that grades
      # 3 files while reading like it grades all of them is worse than no gate.
      #
      # The empty-list guard is load-bearing for the same reason: lint-shell.sh
      # called with ZERO file arguments falls back to its OWN default scope,
      # which is ContainerHub's tree - it would pass, green, having checked none
      # of this repository's scripts.
      #
      # Both exclusions are code this repo does not own and cannot fix:
      # third_party/ is the submodules, rust_builder/cargokit/ is the vendored
      # Cargokit tree Flutter's Rust plugin template drops in. Every other gate
      # exempts the same pair - AGENTS.md paragraph 4, the cmake-format steps on
      # both platforms (the Windows one spells it
      # `-notmatch '^rust_builder/cargokit/'`), and the "Lint PowerShell" step
      # in dart_on_native_windows.yml, which skips Cargokit's resolve_symlinks.ps1
      # for exactly this reason. 19 tracked *.sh minus Cargokit's 2 leaves the 17
      # this gate grades. A finding in there is fixed upstream, never by
      # loosening a shellcheck flag here.
      - name: Lint shell scripts (ContainerHub shellcheck gate)
        shell: bash
        run: |
          mapfile -t files < <(git ls-files '*.sh' | grep -v -e '^third_party/' -e '^rust_builder/cargokit/')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no tracked *.sh outside third_party/ and rust_builder/cargokit/ - the file list driving this gate is empty, refusing to report green over nothing"
            exit 1
          fi
          echo "shellcheck scope (${#files[@]} files):"
          printf '  %s\n' "${files[@]}"
          bash third_party/ContainerHub/linux/scripts/lint-shell.sh "${files[@]}"

      # The explicit root is required, not cosmetic: this script sits INSIDE the
      # submodule, so its default root resolves to ContainerHub and it would
      # lint the hub's workflows instead of this repo's - green, over nothing.
      # .github/actionlint.yaml teaches the pinned actionlint the ubuntu-26.04
      # runner labels it predates.
      - name: Lint workflows (ContainerHub actionlint gate)
        run: >-
          bash third_party/ContainerHub/linux/scripts/lint-workflows.sh
          "${{ github.workspace }}"

      # Same argument, same reason. Expect a triage batch on the first run: no
      # secret gate has ever run over this tree, and a --no-git tree scan of the
      # workspace covers the checked-out third_party/ submodules as well.
      #
      # Rule config AT THE PIN (ContainerHub 71cfd6dc): always the hub's own
      # .gitleaks.toml. That revision cd's into the submodule and passes
      # --config "<hub>/.gitleaks.toml" unconditionally, so a .gitleaks.toml
      # added at THIS repo's root is read by nothing - do not add one and
      # expect it to take effect. Consumer-config resolution (the scanned
      # tree's own .gitleaks.toml wins; the hub's is only the fallback) is
      # committed in ContainerHub but is NOT in the revision pinned here; it
      # starts working only once that pin is bumped.
      #
      # So a finding is a real leak - rotate and purge - or a false positive.
      # Until the pin is bumped a false positive has to be answered in the
      # hub's .gitleaks.toml (a ContainerHub change plus a pin bump here, not a
      # local file); after the bump it earns ONE narrow, commented allowlist
      # entry in a root .gitleaks.toml. Never a blanket ignore file.
      - name: Secret scan (ContainerHub gitleaks gate)
        run: >-
          bash third_party/ContainerHub/linux/scripts/lint-secrets.sh
          "${{ github.workspace }}"

  build:
    strategy:
      # The arm64 row currently cannot pass (the image tag is amd64-only), and
      # with the default fail-fast it cancels the x64 row before it finishes —
      # hiding whether the healthy lane is green. See AGENTS.md § 3.
      fail-fast: false
      matrix:
        include:
          - runs_on: ubuntu-26.04
            arch: x64
            build_mode: release
            platform: linux/amd64
            app_name: omni-accelerant
            flutter_dir: /opt/flutter
            container_image: ghcr.io/kataglyphis/kataglyphis_beschleuniger:latest-cross
            package_formats: tar,deb,flatpak,appimage
            install_packaging_deps: true
          - runs_on: ubuntu-26.04-arm
            arch: arm64
            build_mode: release
            platform: linux/arm64
            app_name: omni-accelerant
            flutter_dir: /opt/flutter
            container_image: ghcr.io/kataglyphis/kataglyphis_beschleuniger:latest-cross
            package_formats: tar,deb,flatpak,appimage
            install_packaging_deps: true

    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
      security-events: write

    steps:
      # Reclaim disk, check out, log in to ghcr and pull the image with retries
      # — ContainerHub's shared prologue, so the retry count and submodule flags
      # cannot drift between this workflow and its siblings. The pull takes no
      # --platform, which is only correct for a multi-arch tag — see the arm64
      # note in AGENTS.md § 3.
      - name: Prepare CI host
        uses: Kataglyphis/ContainerHub/.github/actions/prepare-linux-ci-host@main
        with:
          image: ${{ matrix.container_image }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}
          fetch-depth: '1'
          submodules: recursive

      - name: Run container
        uses: Kataglyphis/ContainerHub/.github/actions/run-in-linux-container@main
        with:
          image: ${{ matrix.container_image }}
          extra-args: --privileged --platform "${{ matrix.platform }}"
          script: >-
            bash /workspace/scripts/linux/ci/ci-container-run-native-linux.sh
            --arch "${{ matrix.arch }}"
            --build-mode "${{ matrix.build_mode }}"
            --flutter-dir "${{ matrix.flutter_dir }}"
            --app-name "${{ matrix.app_name }}"
            --package-formats "${{ matrix.package_formats }}"
            --install-packaging-deps "${{ matrix.install_packaging_deps }}"
            --strict-checks false
            --run-codeql "${{ matrix.arch == 'x64' }}"
            --run-docs "${{ matrix.arch == 'x64' }}"

      # Upload SARIF to GitHub Code Scanning
      - name: Upload CodeQL results SARIF
        if: ${{ matrix.arch == 'x64' && hashFiles('codeql-results/*.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: codeql-results
      
      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.app_name }}-linux-${{ matrix.arch }}-tar
          path: out/${{ matrix.app_name }}-linux-${{ matrix.arch }}.tar.gz

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.app_name }}-linux-${{ matrix.arch }}-packages
          path: |
            out/*.deb
            out/*.AppImage
            out/*.flatpak

      - name: Fix permissions for doc directory
        if: ${{ matrix.arch == 'x64' }}
        run: |
          sudo chown -R $USER:$USER ./doc/api/
          sudo chmod -R 755 ./doc/api/
          ls -la ./doc/api/

      - name: 📂 Sync files to domain
        if: ${{ matrix.arch == 'x64' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PW }}
          local-dir: "./doc/api/"
