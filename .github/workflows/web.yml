# .github/workflows/web.yml
#
# Web: the Flutter web build with the Rust wasm, on an x64 runner. One workflow
# file per platform (owner convention 2026-09-24); web has no arch of its own.
#
# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Web · build + test

env:
  LOCAL_ASSETS_FOLDER: "assets"
  BUILD_DIR_RELEASE: "build/web"

# The web lane is the ONLY place several failure classes can be caught: Rust
# `i64` is `int` natively and `BigInt` on web, `dart:js_interop` code compiles
# nowhere else, and a stale frb binding shows up as an empty `Uncaught` in the
# browser (AGENTS.md § 4). Running it only after merge meant develop was where
# those were discovered. The job NAME is deliberately unchanged — it was the
# required-status-check string on develop's branch protection, and BACKLOG.md
# records that neither branch carries protection as of 2026-09-17, so check
# before renaming rather than assuming the name is load-bearing.
on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

# Same shape as submodule-pins.yml. This lane builds the Rust wasm and
# recompiles the standard library, so two runs of it on one ref is the most
# expensive way to learn the same thing twice — and the pull_request trigger
# above is what made that reachable, because every push to a PR branch starts
# another one. The other build lanes got their own per-ref groups
# (windows-x64-, linux-x64-, linux-arm64-, android-) with the same
# cancel-in-progress: true; see BACKLOG.md.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🚀 Deploy website on push
    runs-on: ubuntu-26.04
    # Measured 2026-09-24: 11-18 min, image pull and the wasm build included.
    timeout-minutes: 60
    # No security-events here: this lane passes --run-codeql false and has no
    # SARIF upload step, so the scope granted nothing anything in the job could
    # use.
    permissions:
      contents: read

    env:
      FLUTTER_DIR: /opt/flutter

    steps:
      # ANTfrastructure's shared prologue: reclaim disk, check out, log in to ghcr,
      # pull with retries. fetch-depth 0 because the docs/version stamping the
      # web build performs wants full history.
      #
      # `image:` is DELIBERATELY ABSENT, here and on the run step below. The
      # family image ref has exactly one owner - IMAGE_REGISTRY_PREFIX +
      # CI_IMAGE_LINUX_TAG in ANTfrastructure's linux/scripts/01-core/versions.env
      # - and both composite actions carry that composed ref as the `image`
      # input default, checked against versions.env by
      # linux/scripts/verify_ci_image_refs.py. Omitting the input is how this
      # lane inherits it; a job-level CONTAINER_IMAGE env would be a second
      # copy no gate compares to the first.
      - name: 🚚 Prepare CI host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@main
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}
          fetch-depth: '0'
          submodules: recursive

      - name: Run container
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          extra-args: --privileged --platform "linux/amd64"
          script: >-
            bash /workspace/scripts/linux/ci/ci-container-run-web-linux.sh
            --arch "x64"
            --flutter-dir "${{ env.FLUTTER_DIR }}"
            --strict-checks true
            --run-codeql false

      - name: Upload Web App Files for Deployment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gstreamer-ai-web-frontend
          path: ${{ env.BUILD_DIR_RELEASE }}/**
          if-no-files-found: error
