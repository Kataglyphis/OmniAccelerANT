# The Flutter web build with the Rust wasm, on an x64 runner.

name: Web · build + test

env:
  LOCAL_ASSETS_FOLDER: "assets"
  BUILD_DIR_RELEASE: "build/web"

# Runs on PRs too: web-only failures (i64 as BigInt, dart:js_interop, stale frb bindings) surface nowhere else.
on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

# The wasm build recompiles the standard library, so a superseded run is expensive.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🚀 Deploy website on push
    runs-on: ubuntu-26.04
    # A run takes 11-18 min, image pull and the wasm build included.
    timeout-minutes: 60
    # No security-events: CodeQL is off and nothing uploads SARIF.
    permissions:
      contents: read
      # compiler-cache-save deletes this key's older cache entries.
      actions: write

    env:
      FLUTTER_DIR: /opt/flutter

    steps:
      # Full history for the build's version stamping; no `image:` (the actions default it from the hub's versions.env).
      - name: 🚚 Prepare CI host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}
          fetch-depth: '0'
          submodules: recursive

      # sccache for the wasm Rust build outlives the container; only pushes to develop save.
      - name: Restore compiler cache
        id: cc
        uses: Kataglyphis/ANTfrastructure/.github/actions/compiler-cache-restore@develop
        with:
          key: x64-web
          mounts: 'sccache:/var/cache/sccache'
          env: 'SCCACHE_CACHE_SIZE=1000M'

      - name: Run container
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: --privileged --platform "linux/amd64" ${{ steps.cc.outputs.docker-args }}
          script: >-
            bash /workspace/scripts/linux/ci/ci-container-run-web-linux.sh
            --arch "x64"
            --flutter-dir "${{ env.FLUTTER_DIR }}"
            --strict-checks true
            --run-codeql false

      - name: Save compiler cache
        if: always() && steps.cc.outputs.path != ''
        uses: Kataglyphis/ANTfrastructure/.github/actions/compiler-cache-save@develop
        with:
          key: x64-web

      - name: Upload Web App Files for Deployment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gstreamer-ai-web-frontend
          path: ${{ env.BUILD_DIR_RELEASE }}/**
          if-no-files-found: error
