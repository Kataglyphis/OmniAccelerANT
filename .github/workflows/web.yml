# The Flutter web build with the Rust wasm on an x64 runner, then the ObservANT packages around it.

name: Web · build + test

env:
  LOCAL_ASSETS_FOLDER: "assets"
  BUILD_DIR_RELEASE: "build/web"

# On request only (third_party/ANTfrastructure/docs/branch-and-release-strategy.md): on-request.yml, release.yml or by hand.
on:
  workflow_dispatch:
  workflow_call:

# The wasm build recompiles the standard library, so a superseded run is expensive.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Flutter web build
    runs-on: ubuntu-26.04
    # A run takes 11-18 min, image pull and the wasm build included.
    timeout-minutes: 60
    # No security-events: CodeQL is off and nothing uploads SARIF.
    permissions:
      contents: read
      # compiler-cache-save deletes this key's older cache entries.
      actions: write

    env:
      FLUTTER_DIR: /opt/flutter

    steps:
      # Full history for the build's version stamping; no `image:` (the actions default it from the hub's versions.env).
      - name: 🚚 Prepare CI host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}
          fetch-depth: '0'
          submodules: recursive

      # sccache for the wasm Rust build outlives the container; only pushes to develop save.
      - name: Restore compiler cache
        id: cc
        uses: Kataglyphis/ANTfrastructure/.github/actions/compiler-cache-restore@develop
        with:
          key: x64-web
          mounts: 'sccache:/var/cache/sccache'
          env: 'SCCACHE_CACHE_SIZE=1000M'

      - name: Run container
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: --privileged --platform "linux/amd64" ${{ steps.cc.outputs.docker-args }}
          script: >-
            bash /workspace/scripts/linux/ci/ci-container-run-web-linux.sh
            --arch "x64"
            --flutter-dir "${{ env.FLUTTER_DIR }}"
            --strict-checks true
            --run-codeql false

      - name: Save compiler cache
        if: always() && steps.cc.outputs.path != ''
        uses: Kataglyphis/ANTfrastructure/.github/actions/compiler-cache-save@develop
        with:
          key: x64-web

      - name: Upload Web App Files for Deployment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gstreamer-ai-web-frontend
          path: ${{ env.BUILD_DIR_RELEASE }}/**
          if-no-files-found: error

  # The installable ObservANT (docs/source/camera-streaming.md § The ObservANT package) around this run's web build.
  observant:
    name: ObservANT package (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-26.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-26.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      # Recursive: the producer is OxidANT's, the model AccelerANTgine's, the G6 census the hub's.
      - name: Prepare CI host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}
          fetch-depth: '1'
          submodules: recursive

      - name: Download the web build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gstreamer-ai-web-frontend
          path: ${{ env.BUILD_DIR_RELEASE }}

      # Privileged: flatpak-builder runs its build commands in bubblewrap.
      - name: Package
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: --privileged --platform "${{ matrix.platform }}"
          script: >-
            bash /workspace/scripts/linux/observant/package-observant.sh
            --web-root /workspace/${{ env.BUILD_DIR_RELEASE }}

      - name: Upload the ObservANT packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omni-observant-linux-${{ matrix.arch }}
          path: |
            out/omni-observant_*.deb
            out/omni-observant-*.AppImage
            out/omni-observant-*.flatpak
            out/omni-observant-*-linux-*.tar.gz
          if-no-files-found: error

      # After the upload, so a red test still leaves the packages to inspect; root installs them, privileged for flatpak run.
      - name: Test the packages
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: --privileged --platform "${{ matrix.platform }}" --user 0:0
          script: >-
            bash /workspace/scripts/linux/observant/test-observant-package.sh

      # A fresh container: the updater installs and replaces fake omni-observant packages there.
      - name: Test the camera updater
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: --platform "${{ matrix.platform }}" --user 0:0
          script: >-
            bash /workspace/scripts/linux/observant/test-observant-update.sh

  # The Windows ObservANT (docs/source/camera-streaming.md § The Windows ObservANT): the MSI around this run's web build, installed in :winamd64.
  observant-windows:
    name: ObservANT package (windows x64)
    needs: build
    runs-on: windows-2025
    # The ~54 GB image pull and the producer's cargo build take most of it.
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh

    steps:
      # The short-path clone and DocumANTation pruning of windows-x64.yml: AGENTS.md § 5, "The CI lane".
      - name: Prepare Windows container host
        id: prep
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-windows-container-host@develop
        with:
          registry-password: ${{ secrets.GHCR_PAT }}
          short-path-target: /d/ws
          exclude-submodules: |
            third_party/DocumANTation

      - name: Download the web build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gstreamer-ai-web-frontend
          path: ${{ steps.prep.outputs.workspace }}/${{ env.BUILD_DIR_RELEASE }}

      - name: Package
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-windows-container@develop
        with:
          file: C:\ws\scripts\windows\observant\Package-ObservANT.ps1
          file-args: |
            -WebRoot
            C:\ws\build\web
            -Msix

      - name: Upload the ObservANT packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omni-observant-windows-x64
          path: |
            ${{ steps.prep.outputs.workspace }}/out/omni-observant-*-windows-*.msi
            ${{ steps.prep.outputs.workspace }}/out/omni-observant-*-windows-*.msix
            ${{ steps.prep.outputs.workspace }}/out/omni-observant-*-windows-*-testcert.cer
            ${{ steps.prep.outputs.workspace }}/out/omni-observant-*-windows-*.zip
          if-no-files-found: error

      # A fresh container, so the install is the MSI's alone; the image runs as ContainerAdministrator, which a per-machine install needs.
      - name: Test the MSI
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-windows-container@develop
        with:
          file: C:\ws\scripts\windows\observant\Test-ObservANTWindows.ps1
          file-args: |
            -Msi
            C:\ws\out\omni-observant-*-windows-x64.msi
            -Photo
            C:\ws\third_party\ANThology\assets\images\cats\*.png

      # Server Core cannot deploy an MSIX, so CI reads the package: signature, startup task, alias, firewall rules, payload.
      - name: Check the MSIX
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-windows-container@develop
        with:
          file: C:\ws\scripts\windows\observant\Test-ObservANTMsix.ps1
          file-args: |
            -Msix
            C:\ws\out\omni-observant-*-windows-x64.msix
