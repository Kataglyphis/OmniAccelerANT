# The arm64-v8a APK, cross-built in the Linux image on an x64 runner, plus the plugin's JVM test and a run on the image's emulator.

name: Android · build + test

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

# A superseded run's verdict never matters, and the APK build takes minutes.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - runs_on: ubuntu-26.04
            arch: x64
            build_mode: release
            platform: linux/amd64
            app_name: omni-accelerant-apk
            flutter_dir: /opt/flutter

    runs-on: ${{ matrix.runs_on }}
    # A run takes 12-25 min, image pull and Gradle included.
    timeout-minutes: 60
    # No security-events: CodeQL is off in CI, so nothing uploads SARIF.
    permissions:
      contents: read
      # compiler-cache-save deletes this key's older cache entries.
      actions: write

    steps:
      # No `image:` here or below: the actions default it from the hub's versions.env, its one owner.
      - name: Prepare CI host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}
          fetch-depth: '1'
          submodules: recursive

      # sccache for cargokit's Rust builds outlives the container; only pushes to develop save.
      - name: Restore compiler cache
        id: cc
        uses: Kataglyphis/ANTfrastructure/.github/actions/compiler-cache-restore@develop
        with:
          key: ${{ matrix.arch }}-android
          mounts: 'sccache:/var/cache/sccache'
          env: 'SCCACHE_CACHE_SIZE=1000M'

      # The emulator smoke needs KVM, and the container's uid 1001 is not in the device's group (hub consumer-image-contract.md).
      - name: Open /dev/kvm to the container
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run container
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: --device /dev/kvm --platform "${{ matrix.platform }}" ${{ steps.cc.outputs.docker-args }}
          script: >-
            bash /workspace/scripts/linux/ci/ci-container-run-android.sh
            --arch "${{ matrix.arch }}"
            --build-mode "${{ matrix.build_mode }}"
            --flutter-dir "${{ matrix.flutter_dir }}"
            --app-name "${{ matrix.app_name }}"
            --emulator-smoke true
            --run-codeql false

      - name: Save compiler cache
        if: always() && steps.cc.outputs.path != ''
        uses: Kataglyphis/ANTfrastructure/.github/actions/compiler-cache-save@develop
        with:
          key: ${{ matrix.arch }}-android

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.app_name }}-linux-${{ matrix.arch }}-tar
          path: out/${{ matrix.app_name }}-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
