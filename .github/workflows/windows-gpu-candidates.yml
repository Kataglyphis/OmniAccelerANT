name: Windows x64 GPU runner candidates (unverified)

on:
  workflow_dispatch:
    inputs:
      gpu-vendor:
        description: Windows GPU candidate vendor to build and check
        type: choice
        options: [all, nvidia, amd]
        default: all
      caller-scope:
        description: Lowercase artifact scope; use distinct scopes for calls in one run
        type: string
        default: default
      verify-gpu:
        description: Profile both installer payloads on a matching self-hosted GPU
        type: boolean
        default: false
      amd-device-index:
        description: DirectML DXGI adapter index for the physical AMD GPU
        type: string
        default: '0'
  workflow_call:
    inputs:
      gpu-vendor:
        type: string
        default: all
      caller-scope:
        type: string
        default: default
      verify-gpu:
        type: boolean
        default: false
      amd-device-index:
        type: string
        default: '0'
    secrets:
      GHCR_PAT:
        required: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: windows-2025
    timeout-minutes: 15
    outputs:
      repository: ${{ steps.image.outputs.repository }}
      python: ${{ steps.python.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      selection: ${{ steps.matrix.outputs.selection }}
      scope: ${{ steps.matrix.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Test GPU candidate selectors
        shell: pwsh
        run: |
          python scripts/linux/tests/test-gpu-candidate-preflight.py
          if ($LASTEXITCODE -ne 0) { throw 'GPU selector tests failed' }
      - name: Test GPU profile contracts
        if: ${{ inputs.verify-gpu }}
        shell: pwsh
        run: |
          python scripts/linux/preflight-gpu-candidate.py --profile-contract
          if ($LASTEXITCODE -ne 0) { throw 'GPU profile bridge or helpers are unavailable' }
          python -I scripts/windows/tests/test_gpu_detector_parity.py
          if ($LASTEXITCODE -ne 0) { throw 'GPU detector parity fixtures failed' }
          python -I scripts/windows/tests/test_profile_gpu_installers.py
          if ($LASTEXITCODE -ne 0) { throw 'GPU installer profile fixtures failed' }
          python -I scripts/windows/tests/test_gpu_process.py
          if ($LASTEXITCODE -ne 0) { throw 'GPU process cleanup fixtures failed' }
      - name: Validate DirectML adapter selection
        if: ${{ inputs.verify-gpu }}
        shell: pwsh
        env:
          AMD_DEVICE_INDEX: ${{ inputs.amd-device-index }}
        run: |
          $index = [long]0
          if ($env:AMD_DEVICE_INDEX -cnotmatch '^(0|[1-9][0-9]*)$' -or -not [long]::TryParse($env:AMD_DEVICE_INDEX, [ref]$index) -or $index -gt 2147483647) { throw 'Invalid DirectML adapter index' }
      - name: Test locked model containment
        shell: pwsh
        run: |
          python -I scripts/windows/tests/test_verify_detector_model.py
          if ($LASTEXITCODE -ne 0) { throw 'Locked model containment tests failed' }
          Import-Module Pester -RequiredVersion 3.4.0
          $result = Invoke-Pester -Script scripts/windows/tests/DetectorModel.Tests.ps1 -PassThru
          if ($result.FailedCount -ne 0 -or $result.PassedCount -ne 5) { throw 'Model staging fixtures failed or did not all run' }
          # The negative fixtures leave the verifier's exit 1 in LASTEXITCODE, which the runner's wrapper would return.
          exit 0
      - name: Check recorded GPU dependencies before pulling images
        shell: pwsh
        run: ./scripts/windows/Test-WindowsGpuPins.ps1
      - name: Select supported GPU vendors
        id: matrix
        shell: pwsh
        env:
          GPU_VENDOR: ${{ inputs.gpu-vendor }}
          CALLER_SCOPE: ${{ inputs.caller-scope }}
        run: |
          $matrix = python scripts/linux/preflight-gpu-candidate.py --windows-matrix $env:GPU_VENDOR
          if ($LASTEXITCODE -ne 0) { throw 'Unsupported GPU vendor' }
          $scope = python scripts/linux/preflight-gpu-candidate.py --scope $env:CALLER_SCOPE
          if ($LASTEXITCODE -ne 0) { throw 'Invalid caller scope' }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "matrix=$matrix"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "selection=$env:GPU_VENDOR"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "scope=$scope"
      - name: Read registry image prefix
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="$(bash third_party/ANTfrastructure/linux/scripts/ci-image-ref.sh --windows)"
          repository="${image%:*}"
          [[ -n "$repository" && "$repository" != "$image" ]] || { echo 'Invalid registry image reference' >&2; exit 1; }
          printf 'repository=%s\n' "$repository" >> "$GITHUB_OUTPUT"
      - name: Read pinned Python
        id: python
        shell: pwsh
        run: |
          $line = Select-String -LiteralPath third_party/ANTfrastructure/linux/scripts/01-core/versions.env -Pattern '^PYTHON_VERSION=(\d+\.\d+)\.' | Select-Object -First 1
          if (-not $line) { throw 'versions.env names no PYTHON_VERSION' }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$($line.Matches[0].Groups[1].Value)"

  candidate:
    needs: preflight
    name: Unverified Windows ${{ matrix.vendor }} x64 runner
    runs-on: windows-2025
    timeout-minutes: 180
    concurrency:
      group: omni-windows-gpu-${{ github.ref }}-${{ github.workflow }}-${{ needs.preflight.outputs.selection }}-${{ needs.preflight.outputs.scope }}-${{ matrix.vendor }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - name: Prepare host and pull the GPU image
        id: prep
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-windows-container-host@develop
        with:
          image: ${{ format('{0}:{1}', needs.preflight.outputs.repository, matrix.tag) }}
          registry-password: ${{ secrets.GHCR_PAT }}
          short-path-target: /d/ws
          exclude-submodules: third_party/DocumANTation
      - name: Verify image inputs before the build
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-windows-container@develop
        with:
          image: ${{ format('{0}:{1}', needs.preflight.outputs.repository, matrix.tag) }}
          file: C:\ws\scripts\windows\Test-WindowsGpuImage.ps1
          file-args: |
            -Provider
            ${{ matrix.provider }}
      - name: Build the GPU runner
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-windows-container@develop
        with:
          image: ${{ format('{0}:{1}', needs.preflight.outputs.repository, matrix.tag) }}
          file: C:\ws\scripts\windows\Build-Windows.ps1
          file-args: |
            -SkipMsixPackaging
            -OrtProvider
            ${{ matrix.provider }}
      - name: Python for native license coverage
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        with:
          python-version: ${{ needs.preflight.outputs.python }}
      - name: Re-prove the delivered runner on the host
        shell: pwsh
        working-directory: ${{ steps.prep.outputs.workspace }}
        run: >-
          ./scripts/windows/Test-WindowsGpuCandidate.ps1
          -RunnerDir build/windows/x64/runner/x64-ClangCL-Windows-Release
          -Provider '${{ matrix.provider }}'
      - name: Start the candidate with CPU selected (no model inference)
        shell: pwsh
        working-directory: ${{ steps.prep.outputs.workspace }}
        run: |
          $env:KATAGLYPHIS_ORT_DEVICE = 'cpu'
          ./scripts/windows/Test-LaunchSmoke.ps1 -AppDir build/windows/x64/runner/x64-ClangCL-Windows-Release -OrtStamp
      - name: Run the bundled model with ONNX Runtime CPU
        shell: pwsh
        working-directory: ${{ steps.prep.outputs.workspace }}
        run: ./scripts/windows/Test-OnnxSelfCheck.ps1 -AppDir build/windows/x64/runner/x64-ClangCL-Windows-Release
      - name: Upload unverified runner candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unverified-omni-windows-x64-${{ matrix.vendor }}-runner-${{ needs.preflight.outputs.selection }}-${{ needs.preflight.outputs.scope }}-attempt-${{ github.run_attempt }}
          overwrite: false
          if-no-files-found: error
          path: ${{ steps.prep.outputs.workspace }}/build/windows/x64/runner/x64-ClangCL-Windows-Release/**/*
      - name: .NET for WiX
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: WiX for the installer candidates
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $wix = Join-Path $env:RUNNER_TEMP 'wix'
          dotnet tool install --tool-path $wix wix --version 7.0.0
          & (Join-Path $wix 'wix.exe') eula accept wix7
          & (Join-Path $wix 'wix.exe') extension add --global WixToolset.UI.wixext/7.0.0
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "WIX=$wix"
      - name: Package unverified GPU MSI and MSIX candidates
        shell: pwsh
        working-directory: ${{ steps.prep.outputs.workspace }}
        run: >-
          ./scripts/windows/Package-OmniAccelerANT.ps1
          -AppDir build/windows/x64/runner/x64-ClangCL-Windows-Release
          -Arch x64 -OrtProvider '${{ matrix.provider }}' -OutDir out
      - name: Install and test candidates with CPU selected
        shell: pwsh
        working-directory: ${{ steps.prep.outputs.workspace }}
        run: |
          $env:KATAGLYPHIS_ORT_DEVICE = 'cpu'
          $dir = 'out/unverified-omni-windows-x64-${{ matrix.vendor }}-installers'
          ./scripts/windows/Test-OmniAccelerANTInstallers.ps1 -Msi "$dir/*.msi" -Msix "$dir/*.msix" -Arch x64 -CheckOnnx
          if ($LASTEXITCODE -ne 0) { throw "$LASTEXITCODE installer check(s) failed" }
      - name: Upload unverified installer candidates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unverified-omni-windows-x64-${{ matrix.vendor }}-installers-${{ needs.preflight.outputs.selection }}-${{ needs.preflight.outputs.scope }}-attempt-${{ github.run_attempt }}
          overwrite: false
          if-no-files-found: error
          path: ${{ steps.prep.outputs.workspace }}/out/unverified-omni-windows-x64-${{ matrix.vendor }}-installers/*
      # Only reached when the installers passed their checks; release.yml collects this name.
      - name: Upload the checked GPU installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omni-accelerant-gpu-${{ matrix.vendor }}-windows-x64-${{ needs.preflight.outputs.scope }}
          overwrite: true
          if-no-files-found: error
          path: |
            ${{ steps.prep.outputs.workspace }}/out/unverified-omni-windows-x64-${{ matrix.vendor }}-installers/*.msi
            ${{ steps.prep.outputs.workspace }}/out/unverified-omni-windows-x64-${{ matrix.vendor }}-installers/*.msix
            ${{ steps.prep.outputs.workspace }}/out/unverified-omni-windows-x64-${{ matrix.vendor }}-installers/*.cer

  gpu-profile:
    if: ${{ !cancelled() && inputs.verify-gpu && needs.preflight.result == 'success' && (needs.candidate.result == 'success' || needs.candidate.result == 'failure') }}
    needs: [preflight, candidate]
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    runs-on: [self-hosted, Windows, X64, '${{ matrix.gpu-runner }}']
    timeout-minutes: 45
    concurrency:
      group: omni-windows-gpu-profile-${{ github.ref }}-${{ github.workflow }}-${{ needs.preflight.outputs.selection }}-${{ needs.preflight.outputs.scope }}-${{ matrix.vendor }}
      cancel-in-progress: true
    steps:
      - name: Check GPU runner disk headroom
        shell: pwsh
        run: |
          foreach ($path in @($env:RUNNER_WORKSPACE, $env:RUNNER_TEMP)) {
            $disk = [IO.DriveInfo]::new([IO.Path]::GetPathRoot([IO.Path]::GetFullPath($path)))
            if ($disk.AvailableFreeSpace -lt (15.5GB + 1GB)) { throw 'Insufficient GPU runner disk headroom' }
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        with:
          python-version: ${{ needs.preflight.outputs.python }}
      - name: Select this attempt's installer artifact and check its size
        id: artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_NAME: unverified-omni-windows-x64-${{ matrix.vendor }}-installers-${{ needs.preflight.outputs.selection }}-${{ needs.preflight.outputs.scope }}-attempt-${{ github.run_attempt }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/artifacts?per_page=100"
          $result = Invoke-RestMethod -Uri $uri -Headers $headers
          if ($result.total_count -gt 100) { throw 'Too many artifacts to select safely' }
          $found = @($result.artifacts | Where-Object { $_.name -ceq $env:EXPECTED_NAME -and -not $_.expired })
          if ($found.Count -ne 1) { throw 'Expected one current-attempt installer artifact' }
          $artifact = $found[0]
          if ($artifact.workflow_run.id -ne [long]$env:GITHUB_RUN_ID -or $artifact.workflow_run.head_sha -cne $env:GITHUB_SHA -or $artifact.digest -cnotmatch '^sha256:[0-9a-f]{64}$') { throw 'Installer artifact identity mismatch' }
          $disk = [IO.DriveInfo]::new([IO.Path]::GetPathRoot([IO.Path]::GetFullPath($env:RUNNER_TEMP)))
          if ($artifact.size_in_bytes -le 0 -or ($disk.AvailableFreeSpace - $artifact.size_in_bytes) -lt (15.5GB + 1GB)) { throw 'Insufficient space for installer artifact' }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "id=$($artifact.id)"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "digest=$($artifact.digest)"
      - name: Create profile scratch
        id: scratch
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP ('omni-windows-evidence-' + [guid]::NewGuid().ToString('N'))
          $null = New-Item -ItemType Directory -Path $root -ErrorAction Stop
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "root=$root"
      - name: Download the selected installer archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.artifact.outputs.id }}
          path: ${{ steps.scratch.outputs.root }}/archive
          skip-decompress: true
          digest-mismatch: error
      - name: Profile MSI and MSIX payloads
        shell: pwsh
        env:
          PROFILE_ROOT: ${{ steps.scratch.outputs.root }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.digest }}
          GPU_VENDOR: ${{ matrix.vendor }}
          PROVIDER: ${{ matrix.provider }}
          DIRECTML_INDEX: ${{ inputs.amd-device-index }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archives = @(Get-ChildItem -LiteralPath "$env:PROFILE_ROOT/archive" -File)
          if ($archives.Count -ne 1) { throw 'Expected one installer archive' }
          $planText = python -I scripts/windows/profile_gpu_installers.py plan $archives[0].FullName --vendor $env:GPU_VENDOR --evidence $env:PROFILE_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Installer archive size or names are invalid' }
          $plan = $planText | ConvertFrom-Json
          $identity = @('--repository', $env:GITHUB_REPOSITORY, '--revision', $env:GITHUB_SHA, '--run-id', $env:GITHUB_RUN_ID,
            '--run-attempt', $env:GITHUB_RUN_ATTEMPT, '--artifact-id', $env:ARTIFACT_ID, '--artifact-digest', $env:ARTIFACT_DIGEST,
            '--platform', 'windows', '--arch', 'x64', '--vendor', $env:GPU_VENDOR)
          foreach ($file in $plan.files) { $identity += @('--file', $file) }
          $shared = 'third_party/ANTfrastructure/shared/python'
          python -I "$shared/prepare_gpu_artifact.py" --archive $archives[0].FullName --output "$env:PROFILE_ROOT/packages" `
            --before-receipt "$env:PROFILE_ROOT/before.json" --max-uncompressed-bytes 4294967296 --max-compression-ratio 1000 @identity
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare the installer artifact' }
          $evidence = Join-Path $env:PROFILE_ROOT 'evidence'
          $null = New-Item -ItemType Directory -Path $evidence
          python -I scripts/windows/profile_gpu_installers.py profile "$env:PROFILE_ROOT/packages" --vendor $env:GPU_VENDOR `
            --device $env:PROVIDER --directml-index $env:DIRECTML_INDEX --evidence $evidence
          if ($LASTEXITCODE -ne 0) { throw 'Extracted installer GPU profile failed' }
          python -I "$shared/gpu_artifact_receipt.py" verify --directory "$env:PROFILE_ROOT/packages" --receipt "$env:PROFILE_ROOT/before.json" --check before-check @identity
          if ($LASTEXITCODE -ne 0) { throw 'Installer bytes changed during profiling' }
          Copy-Item -LiteralPath "$env:PROFILE_ROOT/before.json" -Destination "$evidence/before.json"
          python -I "$shared/gpu_artifact_receipt.py" create --directory "$env:PROFILE_ROOT/packages" --receipt "$evidence/receipt.json" --check gpu-model-inference @identity
          if ($LASTEXITCODE -ne 0) { throw 'Could not create GPU profile receipt' }
      - name: Upload GPU profile evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omni-windows-gpu-profile-${{ matrix.vendor }}-${{ needs.preflight.outputs.selection }}-${{ needs.preflight.outputs.scope }}-attempt-${{ github.run_attempt }}
          overwrite: false
          if-no-files-found: error
          path: ${{ steps.scratch.outputs.root }}/evidence
      - name: Remove profile scratch
        if: ${{ always() && steps.scratch.outcome == 'success' }}
        shell: pwsh
        env:
          PROFILE_ROOT: ${{ steps.scratch.outputs.root }}
        run: |
          $base = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
          $root = [IO.Path]::GetFullPath($env:PROFILE_ROOT)
          if (-not $root.StartsWith($base, [StringComparison]::OrdinalIgnoreCase) -or (Split-Path -Leaf $root) -cnotmatch '^omni-windows-evidence-[0-9a-f]{32}$') { throw 'Unsafe profile scratch path' }
          Remove-Item -LiteralPath $root -Recurse -Force
