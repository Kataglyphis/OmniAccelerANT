# The native Linux build both linux-<arch>.yml share; no concurrency group, as one here would queue behind the caller's.
name: Linux · reusable build

on:
  workflow_call:
    inputs:
      runner:
        description: runs-on label. A pinned image, never a moving *-latest alias.
        required: true
        type: string
      arch:
        description: ci-container-run-native-linux.sh --arch (x64 | arm64).
        required: true
        type: string
      platform:
        description: The container's --platform; pairs with arch (linux/amd64 | linux/arm64).
        required: true
        type: string
      build-mode:
        required: true
        type: string
      app-name:
        description: Explicit on purpose - it keeps CI independent of a host's pwd (AGENTS.md § 5).
        required: true
        type: string
      flutter-dir:
        required: true
        type: string
      package-formats:
        required: true
        type: string
      install-packaging-deps:
        required: true
        type: boolean
    # Optional, so fork PRs reach the steps with empty values instead of failing at the call.
    secrets:
      GHCR_PAT:
        required: false

# Read-only: the ghcr login uses its own secret, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  build:
    name: build + package (${{ inputs.arch }})
    runs-on: ${{ inputs.runner }}
    # x64 takes 15-17 min, arm64 10-12 min, image pull included.
    timeout-minutes: 60
    # No security-events: the native flow runs no CodeQL scan.
    permissions:
      contents: read
      # compiler-cache-save deletes this key's older cache entries.
      actions: write

    steps:
      # No `image:` here or below: the actions default it from the hub's versions.env; the pull needs a multi-arch tag.
      - name: Prepare CI host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}
          fetch-depth: '1'
          submodules: recursive
          # A measurement: the 28 GiB pull took 318-325 s on x64 at docker's default of 3 (2026-10-16/17).
          max-concurrent-downloads: '10'

      # sccache (Rust via RUSTC_WRAPPER, C++ via the CMake launcher) outlives the container; only pushes to develop save.
      - name: Restore compiler cache
        id: cc
        uses: Kataglyphis/ANTfrastructure/.github/actions/compiler-cache-restore@develop
        with:
          key: ${{ inputs.arch }}-native
          mounts: 'sccache:/var/cache/sccache'
          env: 'SCCACHE_CACHE_SIZE=1500M'

      # --run-docs false: docs.yml builds the site. Invoke-LinuxLane.ps1 -CheckParity parses extra-args and script.
      - name: Run container
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: --privileged --platform "${{ inputs.platform }}" -e CI=true ${{ steps.cc.outputs.docker-args }}
          script: >-
            bash /workspace/scripts/linux/ci/ci-container-run-native-linux.sh
            --arch "${{ inputs.arch }}"
            --build-mode "${{ inputs.build-mode }}"
            --flutter-dir "${{ inputs.flutter-dir }}"
            --app-name "${{ inputs.app-name }}"
            --package-formats "${{ inputs.package-formats }}"
            --install-packaging-deps "${{ inputs.install-packaging-deps }}"
            --strict-checks true
            --run-codeql false
            --run-docs false

      # Against the median of the default branch's last 20 runs on this arch; a passing default-branch run joins them.
      - name: Frontend performance report
        if: always() && hashFiles('out/perf/frontend.json') != ''
        uses: Kataglyphis/ANTfrastructure/.github/actions/frontend-perf-report@develop
        with:
          key: frontend-perf-${{ inputs.arch }}

      - name: Save compiler cache
        if: always() && steps.cc.outputs.path != ''
        uses: Kataglyphis/ANTfrastructure/.github/actions/compiler-cache-save@develop
        with:
          key: ${{ inputs.arch }}-native

      # No SARIF upload: the native flow runs no CodeQL scan, and an always-skipped upload reads as coverage.

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.app-name }}-linux-${{ inputs.arch }}-tar
          path: out/${{ inputs.app-name }}-linux-${{ inputs.arch }}.tar.gz
          if-no-files-found: error

      # `error` fails only when NONE of the three globs matches.
      - name: Upload Linux packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.app-name }}-linux-${{ inputs.arch }}-packages
          path: |
            out/*.deb
            out/*.AppImage
            out/*.flatpak
          if-no-files-found: error
