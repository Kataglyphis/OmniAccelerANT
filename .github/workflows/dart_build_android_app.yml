# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build + test + run android app

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - runs_on: ubuntu-24.04
            arch: x64
            build_mode: release
            platform: linux/amd64
            app_name: kataglyphis-inference-engine-apk
            flutter_dir: /opt/flutter
            container_image: ghcr.io/kataglyphis/kataglyphis_beschleuniger:latest-cross

    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
      security-events: write

    steps:
      # ContainerHub's shared prologue: reclaim disk, check out, log in to ghcr,
      # pull with retries.
      - name: Prepare CI host
        uses: Kataglyphis/ContainerHub/.github/actions/prepare-linux-ci-host@main
        with:
          image: ${{ matrix.container_image }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}
          fetch-depth: '1'
          submodules: recursive

      - name: Run container
        uses: Kataglyphis/ContainerHub/.github/actions/run-in-linux-container@main
        with:
          image: ${{ matrix.container_image }}
          extra-args: --platform "${{ matrix.platform }}"
          script: >-
            bash /workspace/scripts/linux/ci/ci-container-run-android.sh
            --arch "${{ matrix.arch }}"
            --build-mode "${{ matrix.build_mode }}"
            --flutter-dir "${{ matrix.flutter_dir }}"
            --app-name "${{ matrix.app_name }}"
            --run-codeql "${{ matrix.arch == 'x64' }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: ${{ matrix.app_name }}-linux-${{ matrix.arch }}-tar
          path: out/${{ matrix.app_name }}-linux-${{ matrix.arch }}.tar.gz

      # Upload SARIF to GitHub Code Scanning
      - name: Upload CodeQL results SARIF
        if: ${{ matrix.arch == 'x64' && hashFiles('codeql-results/*.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: codeql-results
