# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build + test + run android app

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - runs_on: ubuntu-26.04
            arch: x64
            build_mode: release
            platform: linux/amd64
            app_name: omni-accelerant-apk
            flutter_dir: /opt/flutter

    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
      security-events: write

    steps:
      # ANTfrastructure's shared prologue: reclaim disk, check out, log in to ghcr,
      # pull with retries.
      #
      # `image:` is DELIBERATELY ABSENT, here and on the run step below. The
      # family image ref has exactly one owner - IMAGE_REGISTRY_PREFIX +
      # CI_IMAGE_LINUX_TAG in ANTfrastructure's linux/scripts/01-core/versions.env
      # - and both composite actions carry that composed ref as the `image`
      # input default, checked against versions.env by
      # linux/scripts/verify_ci_image_refs.py. Omitting the input is how this
      # lane inherits it; spelling the tag out again here would be a second
      # copy no gate compares to the first.
      - name: Prepare CI host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@main
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}
          fetch-depth: '1'
          submodules: recursive

      - name: Run container
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          extra-args: --platform "${{ matrix.platform }}"
          script: >-
            bash /workspace/scripts/linux/ci/ci-container-run-android.sh
            --arch "${{ matrix.arch }}"
            --build-mode "${{ matrix.build_mode }}"
            --flutter-dir "${{ matrix.flutter_dir }}"
            --app-name "${{ matrix.app_name }}"
            --run-codeql "${{ matrix.arch == 'x64' }}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.app_name }}-linux-${{ matrix.arch }}-tar
          path: out/${{ matrix.app_name }}-linux-${{ matrix.arch }}.tar.gz

      # Upload SARIF to GitHub Code Scanning.
      #
      # No `continue-on-error`. This is the only lane in the repository that
      # actually produces CodeQL results (codeql-android.sh), so a failed
      # upload means the alerts never reached Code Scanning - exactly the
      # outcome that suppression used to hide. The `hashFiles` guard already
      # covers "no results to upload", and ci-container-run-android.sh now
      # fails outright when the scan itself fails, so an empty results
      # directory can no longer coexist with a green job.
      - name: Upload CodeQL results SARIF
        if: ${{ matrix.arch == 'x64' && hashFiles('codeql-results/*.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          sarif_file: codeql-results
