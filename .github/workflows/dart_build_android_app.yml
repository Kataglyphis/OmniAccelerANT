# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build + test + run android app

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

# Per-ref group, like the web lane. The APK build is minutes, not seconds, and
# this lane no longer runs CodeQL (owner directive 2026-09-17): the scan is
# budgeted in hours and is a manual/local run now - see the --run-codeql false
# below and AGENTS.md § 5. A superseded run's verdict can never be the one that
# matters, so leaving it queued behind a new commit is pure cost.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - runs_on: ubuntu-26.04
            arch: x64
            build_mode: release
            platform: linux/amd64
            app_name: omni-accelerant-apk
            flutter_dir: /opt/flutter

    runs-on: ${{ matrix.runs_on }}
    # No security-events: the CodeQL scan is off in CI, so nothing uploads
    # SARIF here any more.
    permissions:
      contents: read

    steps:
      # ANTfrastructure's shared prologue: reclaim disk, check out, log in to ghcr,
      # pull with retries.
      #
      # `image:` is DELIBERATELY ABSENT, here and on the run step below. The
      # family image ref has exactly one owner - IMAGE_REGISTRY_PREFIX +
      # CI_IMAGE_LINUX_TAG in ANTfrastructure's linux/scripts/01-core/versions.env
      # - and both composite actions carry that composed ref as the `image`
      # input default, checked against versions.env by
      # linux/scripts/verify_ci_image_refs.py. Omitting the input is how this
      # lane inherits it; spelling the tag out again here would be a second
      # copy no gate compares to the first.
      - name: Prepare CI host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@main
        with:
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}
          fetch-depth: '1'
          submodules: recursive

      - name: Run container
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          extra-args: --platform "${{ matrix.platform }}"
          script: >-
            bash /workspace/scripts/linux/ci/ci-container-run-android.sh
            --arch "${{ matrix.arch }}"
            --build-mode "${{ matrix.build_mode }}"
            --flutter-dir "${{ matrix.flutter_dir }}"
            --app-name "${{ matrix.app_name }}"
            --run-codeql false

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.app_name }}-linux-${{ matrix.arch }}-tar
          path: out/${{ matrix.app_name }}-linux-${{ matrix.arch }}.tar.gz
