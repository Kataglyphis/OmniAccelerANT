# A native arm64 runner (no QEMU) builds all four package formats; the lint gates run once, in linux-x64.yml.

name: Linux arm64 · build + test

# On request only (third_party/ANTfrastructure/docs/branch-and-release-strategy.md): on-request.yml, release.yml or by hand.
on:
  workflow_dispatch:
  workflow_call:

# Its own group per caller, so neither the x64 verdict nor another caller's run is cancelled.
concurrency:
  group: linux-arm64-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

# Top-level, so every job below inherits it and none can be added without one.
permissions:
  contents: read

jobs:
  # Keep `with:` a flat block of plain `key: value` lines: Invoke-LinuxLane.ps1 -CheckParity parses it.
  build:
    permissions:
      contents: read
      # reusable-linux.yml's compiler-cache-save deletes its key's older entries.
      actions: write
    uses: ./.github/workflows/reusable-linux.yml
    with:
      runner: ubuntu-26.04-arm
      arch: arm64
      platform: linux/arm64
      build-mode: release
      app-name: omni-accelerant
      flutter-dir: /opt/flutter
      package-formats: tar,deb,flatpak,appimage
      install-packaging-deps: true
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  # Inside the image every library is present; the bare image base shows a missing one (hub linux-build-basics.md).
  clean-host:
    name: Packages on a clean Ubuntu 26.04 (arm64)
    needs: build
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    steps:
      # 124 is timeout's: the app was still up after 20 s, as the lane's own launch smoke counts it.
      - name: Install and start the .deb and the AppImage
        uses: Kataglyphis/ANTfrastructure/.github/actions/clean-host-package-check@develop
        with:
          artifact: omni-accelerant-linux-arm64-packages
          apt-packages: xvfb libgl1-mesa-dri libegl-mesa0
          deb: '*.deb'
          deb-command: rc=0; xvfb-run -a timeout 20 omni-accelerant || rc=$?; test "$rc" -eq 124
          appimage: '*.AppImage'
          appimage-command: rc=0; xvfb-run -a timeout 20 "$APPIMAGE" || rc=$?; test "$rc" -eq 124

      - name: Unpack and start the tarball
        uses: Kataglyphis/ANTfrastructure/.github/actions/clean-host-package-check@develop
        with:
          artifact: omni-accelerant-linux-arm64-tar
          tarball: '*.tar.gz'
          tarball-command: rc=0; xvfb-run -a timeout 20 ./omni_accelerant || rc=$?; test "$rc" -eq 124
