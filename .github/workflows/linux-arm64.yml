# A native arm64 runner (no QEMU) builds all four package formats; the lint gates run once, in linux-x64.yml.

name: Linux arm64 · build + test

# On request only (third_party/ANTfrastructure/docs/branch-and-release-strategy.md): on-request.yml, release.yml or by hand.
on:
  workflow_dispatch:
  workflow_call:

# Its own group per caller, so neither the x64 verdict nor another caller's run is cancelled.
concurrency:
  group: linux-arm64-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

# Top-level, so every job below inherits it and none can be added without one.
permissions:
  contents: read

jobs:
  # Keep `with:` a flat block of plain `key: value` lines: Invoke-LinuxLane.ps1 -CheckParity parses it.
  build:
    permissions:
      contents: read
      # reusable-linux.yml's compiler-cache-save deletes its key's older entries.
      actions: write
    uses: ./.github/workflows/reusable-linux.yml
    with:
      runner: ubuntu-26.04-arm
      arch: arm64
      platform: linux/arm64
      build-mode: release
      app-name: omni-accelerant
      flutter-dir: /opt/flutter
      package-formats: tar,deb,flatpak,appimage
      install-packaging-deps: true
      # x64 carries the API docs and their deploy.
      run-docs: false
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
