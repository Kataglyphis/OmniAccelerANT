# separate terms of service, privacy policy, and support
# documentation.

name: Build + test + run for web

env:
  LOCAL_ASSETS_FOLDER: "assets"
  BUILD_DIR_RELEASE: "build/web"

on:
  push:
    branches: ["main", "develop"]

jobs:
  build:
    name: 🚀 Deploy website on push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write

    env:
      CONTAINER_IMAGE: ghcr.io/kataglyphis/kataglyphis_beschleuniger:latest-cross
      FLUTTER_VERSION: 3.47.1
      FLUTTER_DIR: /workspace/flutter

    steps:
      # ContainerHub's shared prologue: reclaim disk, check out, log in to ghcr,
      # pull with retries. fetch-depth 0 because the docs/version stamping the
      # web build performs wants full history.
      - name: 🚚 Prepare CI host
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/prepare-linux-ci-host@main
        with:
          image: ${{ env.CONTAINER_IMAGE }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}
          fetch-depth: '0'
          submodules: recursive

      - name: Run container
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/run-in-linux-container@main
        with:
          image: ${{ env.CONTAINER_IMAGE }}
          # CARGO_HOME: the image sets it to /usr/local/cargo, which is root-owned
          # while the container runs as uid 1001, so every cargo step that WRITES
          # (registry index/cache, flutter_rust_bridge codegen) dies with
          #   error: failed to create directory `/usr/local/cargo/registry/cache/...`
          # Point it somewhere the uid owns, as the sibling Rust lanes already do.
          extra-args: --privileged --platform "linux/amd64" -e CARGO_HOME=/tmp/cargo-home
          script: >-
            bash /workspace/scripts/linux/ci/ci-container-run-web-linux.sh
            --arch "x64"
            --flutter-version "${{ env.FLUTTER_VERSION }}"
            --flutter-dir "${{ env.FLUTTER_DIR }}"
            --install-flutter true
            --strict-checks false
            --run-codeql false

      - name: Upload Web App Files for Deployment
        uses: actions/upload-artifact@v6.0.0
        with:
          name: gstreamer-ai-web-frontend
          path: ${{ env.BUILD_DIR_RELEASE }}/**
          if-no-files-found: error
