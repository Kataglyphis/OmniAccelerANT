// The Android Gradle Plugin builds the native code with the Android NDK.

group 'com.flutter_rust_bridge.rust_lib_omni_accelerant'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        // Keep this aligned with the root Android project to avoid Gradle/AGP/JDK mismatches.
        classpath 'com.android.tools.build:gradle:9.4.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.flutter_rust_bridge.rust_lib_omni_accelerant'
    }

    // compileSdkVersion, buildToolsVersion and ndkVersion come from the root
    // android/build.gradle.kts - one source of truth for what /opt/android-sdk
    // ships (AGENTS.md § 4). Cargokit reads them in gradle.afterProject, after
    // the root override has set them.

    compileOptions {
        // Flutter's Android toolchain and most plugins target Java 17.
        // Using Java 21 here can trigger Gradle toolchain resolution issues depending on the installed JDK.
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    defaultConfig {
        minSdkVersion 21
    }
}

apply from: "../cargokit/gradle/plugin.gradle"
cargokit {
    manifestDir = "../../third_party/OxidANT"
    libname = "oxidant"
}
