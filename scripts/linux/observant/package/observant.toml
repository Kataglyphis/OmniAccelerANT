# ObservANT. Uncomment a setting to change it, then: sudo systemctl restart omni-observant

# `omni-observant --print-config` prints the settings in effect; `systemctl disable --now omni-observant` stops autostart.

# camera = "auto"          # a Raspberry Pi camera if attached, else a USB webcam; or rpicam | libcamera | v4l2 | v4l2:/dev/video0 | test | image:FILE

# rotate = 0               # clockwise: 90 | 180 | 270; the page's rotate buttons override it

# width = 640

# height = 480

# fps = 30

# name = "ObservANT"       # what viewers see

# inference = "auto"       # auto | on | off; auto skips the model below 1 GiB of RAM or when it fails to load

# model = "/opt/omni-observant/models/deim_dfine_n_coco.onnx"

# score = 0.25

# inference_fps = 2        # box updates per second; 0 runs the model as often as it can

# inference_threads = 2    # the model's threads; 0 takes one per core, which costs more CPU per update

# idle_inference_fps = 0.2 # the model's rate while nothing moves and no cat is in sight (none while the picture is black); inference_fps or more turns that off

# classes = ["cat"]        # the COCO classes that count, e.g. ["cat", "dog", "bird"]; the Camera page changes them too

# all_classes = false      # true counts every COCO class, whatever classes says

# privacy = "off"          # "pixelate" blocks out all but the detected animals in the stream, snapshot, photos and clips; only this file turns it on or off

# http_port = 8080         # the page is http://<this-host>:8080/; 0 turns the web server off

# http_host = "0.0.0.0"

# ice_port_min = 40000     # WebRTC media's UDP range; `sudo ufw allow OmniObservANT` opens it and http_port

# ice_port_max = 40099

# stun_server = ""         # e.g. "stun://stun.l.google.com:19302"; empty keeps the stream LAN-only

# notify_url = ""          # an http(s) URL POSTed {"event": "arrived"|"left"|"clip", ...} as JSON when a cat comes or goes

# allowed_hosts = []       # names besides IPs and local ones (.local, .fritz.box, ...) the page may act under, e.g. a reverse proxy's

# max_viewers = 8          # browser tabs on the stream at once; ObservANT encodes for each; 0 is no limit

# peers = []               # the other ObservANT cameras' origins, e.g. ["http://192.168.1.20:8080"]: the Stream page shows them, and they may read this one

# clip_seconds = 10        # seconds of H.264 video per arrival at /arrival.mp4, 3 of them before it; 0 records none
