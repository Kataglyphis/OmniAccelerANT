# Included by reference, not synced: the analyzer unions `analyzer.exclude`, so the excludes below only add to the shared list.
include: third_party/ANTfrastructure/shared/config/analysis_options.yaml

analyzer:
  exclude:
    # The lanes check the Flutter SDK out into the workspace.
    - "flutter/**"
    - "third_party/**"
    # A standalone app with its own pubspec.
    - "packages/*/example/**"
    - "rust_builder/**"
