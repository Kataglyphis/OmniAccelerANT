group = "com.example.kataglyphis_native_inference"
version = "1.0-SNAPSHOT"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:9.4.0")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "com.example.kataglyphis_native_inference"

    // compileSdk, buildToolsVersion and ndkVersion come from the root
    // android/build.gradle.kts; the CMake version reads the same values
    // (AGENTS.md § 4).
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version rootProject.ext.kataglyphisCmake
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 26

        consumerProguardFiles "consumer-rules.pro"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"

                def gstreamerRootAndroid = System.getenv("GSTREAMER_ROOT_ANDROID")
                if (!gstreamerRootAndroid && project.hasProperty("gstreamerRootAndroid")) {
                    gstreamerRootAndroid = project.property("gstreamerRootAndroid")
                }
                if (gstreamerRootAndroid) {
                    arguments "-DGSTREAMER_ROOT_ANDROID=${gstreamerRootAndroid}"
                }
            }
        }

        ndk {
            // Nur noch arm64-v8a für moderne Android-Geräte
            abiFilters "arm64-v8a"
        }
    }

    testOptions {
        // android.os.Build is a stub jar in JVM unit tests; without this,
        // getPlatformVersion's Build.VERSION.RELEASE throws "not mocked".
        unitTests.returnDefaultValues = true
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

// Top-level, not inside android {}: a dependencies block in there resolves
// against the extension and never reaches the project, which is why the test
// source set compiled with no test framework on its classpath until 2026-09-17.
// Plain junit-jupiter, not kotlin-test: with AGP's built-in Kotlin the test
// classpath carries no Kotlin platform attributes, so the KMP-published
// kotlin-test resolves to a metadata-only variant and every `import
// kotlin.test.*` fails "Unresolved reference" while Gradle reports it on the
// classpath. testOptions.unitTests already uses the JUnit platform.
dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    // Gradle 9 stopped injecting the JUnit Platform launcher; without it the
    // suite dies in TestSuiteExecutionException before any test runs.
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
    testImplementation "org.mockito:mockito-core:5.23.0"
}
