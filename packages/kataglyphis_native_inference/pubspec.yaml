name: kataglyphis_native_inference
description: "Native texture + camera plugin for the OmniAccelerANT (Windows/Linux)."
version: 0.0.1
homepage: "jonasheinle.de"

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: '>=3.41.4'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.kataglyphis_native_inference
        pluginClass: KataglyphisNativeInferencePlugin
      linux:
        pluginClass: KataglyphisNativeInferencePlugin
      windows:
        pluginClass: KataglyphisNativeInferencePluginCApi
