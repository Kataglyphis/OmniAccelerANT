name: omni_accelerant
description: "Making an inference with Rust and display the results with Flutter/Dart."
homepage: https://jonasheinle.de

publish_to: "none"

version: 2.0.0+2

environment:
  sdk: ">=3.11.4 <4.0.0"
  flutter: ">=3.41.6"

dependencies:
  flutter:
    sdk: flutter
  anthology:
    path: third_party/ANThology
  kataglyphis_native_inference:
    path: packages/kataglyphis_native_inference
  cupertino_icons: ^1.0.9
  # Floor matches OxidANT's =2.13.0 Rust pin; test/pinned_artefacts_test.dart holds them together.
  flutter_rust_bridge: ^2.13.0
  go_router: ^18.0.0
  font_awesome_flutter: ^11.0.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  oxidant:
    path: rust_builder
  permission_handler: ^13.0.2

  sqlite3: ^3.3.1
  web: ^1.1.1
dev_dependencies:
  # test/pinned_artefacts_test.dart imports it directly, which a transitive dependency does not allow.
  crypto: ^3.0.6
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  msix: ^3.16.13

flutter:
  generate: true
  uses-material-design: true
  # Only app-specific assets; the shared corpus is referenced as `packages/anthology/assets/...`.
  assets:
    - assets/images/
    - assets/documents/
    - assets/documents/footer/
    - assets/data/
    - assets/settings/
    - assets/settings/user_settings/

  # Must nest under `flutter:`: Flutter silently ignores a top-level `fonts:` key.
  fonts:
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/Noto_Sans/static/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/Noto_Sans/static/NotoSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Noto_Sans/static/NotoSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/Noto_Sans/static/NotoSans-BoldItalic.ttf
          weight: 700
          style: italic

flutter_launcher_icons:
  android: true
  image_path: assets/icons/kataglyphis_app_icon.png
  web:
    generate: true
    image_path: assets/icons/kataglyphis_app_icon.png
    background_color: "#0B1220"
    theme_color: "#0B1220"
  windows:
    generate: true
    image_path: assets/icons/kataglyphis_app_icon.png
    icon_size: 256

msix_config:
  # Build-Windows.ps1 owns the build; msix only packages. See AGENTS.md § 5.
  build_windows: false
  display_name: OmniAccelerANT
  publisher_display_name: Kataglyphis
  identity_name: Kataglyphis.OmniAccelerANT
  msix_version: 2.0.0.0
  logo_path: assets/icons/kataglyphis_app_icon.png
