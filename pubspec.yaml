name: omni_accelerant
description: "Making an inference with Rust and display the results with Flutter/Dart."
homepage: https://jonasheinle.de

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.1.0+1

environment:
  sdk: ">=3.11.4 <4.0.0"
  flutter: ">=3.41.6"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  anthology:
    path: third_party/ANThology
  kataglyphis_native_inference:
    path: packages/kataglyphis_native_inference
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.9
  flutter_rust_bridge: ^2.13.0
  go_router: ^17.2.1
  font_awesome_flutter: ^11.0.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  oxidant:
    path: rust_builder
  permission_handler: ^12.0.1

  provider: ^6.1.2
  sqlite3: ^3.3.1
  web: ^1.1.1
dev_dependencies:
  mockito: ^5.6.4
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  msix: ^3.16.13

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true
  uses-material-design: true
  # The shared corpus (images, blog/footer documents, Montserrat + Roboto) now
  # lives in the anthology package and is referenced as
  # `packages/anthology/assets/...`. Only assets unique to this app remain here.
  assets:
    - assets/images/
    - assets/documents/
    - assets/documents/footer/
    - assets/data/
    - assets/settings/
    - assets/settings/user_settings/

  # NESTED under `flutter:` on purpose. This block used to sit at column 0 - a
  # top-level pubspec key - which Flutter silently ignores, so FontManifest.json
  # never carried a single custom face and `fontFamily: 'Roboto'` in main.dart
  # fell back to the platform default. Montserrat and Roboto are declared by the
  # anthology package now (as `packages/anthology/<family>`); Noto Sans is
  # OmniAccelerANT-only, so it stays here - correctly nested.
  fonts:
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/Noto_Sans/static/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/Noto_Sans/static/NotoSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Noto_Sans/static/NotoSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/Noto_Sans/static/NotoSans-BoldItalic.ttf
          weight: 700
          style: italic

flutter_launcher_icons:
  android: true
  image_path: assets/icons/kataglyphis_app_icon.png
  web:
    generate: true
    image_path: assets/icons/kataglyphis_app_icon.png
    background_color: "#0B1220"
    theme_color: "#0B1220"
  windows:
    generate: true
    image_path: assets/icons/kataglyphis_app_icon.png
    icon_size: 256

msix_config:
  # Build-Windows.ps1 owns the build; msix only packages. See AGENTS.md § 4.
  build_windows: false
  display_name: OmniAccelerANT
  publisher_display_name: Kataglyphis
  identity_name: Kataglyphis.OmniAccelerANT
  msix_version: 1.1.0.0
  logo_path: assets/icons/kataglyphis_app_icon.png
