name: omni_accelerant
description: "Making an inference with Rust and display the results with Flutter/Dart."
homepage: https://jonasheinle.de

publish_to: "none"

version: 2.2.1+5

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  anthology:
    path: third_party/ANThology
  kataglyphis_native_inference:
    path: packages/kataglyphis_native_inference
  cupertino_icons: ^2.0.0
  # Floor matches OxidANT's =2.13.0 Rust pin; test/pinned_artefacts_test.dart holds them together.
  flutter_rust_bridge: ^2.13.0
  go_router: ^18.0.0
  font_awesome_flutter: ^11.0.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  oxidant:
    path: rust_builder
  permission_handler: ^13.0.2
  # Link opens ObservANT's /arrival.mp4 in a new tab; ANThology already resolves it.
  url_launcher: ^6.3.2

  # Floor = the hub's SQLITE3_WASM_VERSION: web/sqlite3.wasm is that release's build, so the Dart side may not resolve older.
  sqlite3: ^3.7.0
  web: ^1.1.1
dev_dependencies:
  anthology_test_support:
    path: third_party/ANThology/packages/anthology_test_support
  # test/pinned_artefacts_test.dart imports it directly, which a transitive dependency does not allow.
  crypto: ^3.0.6
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  msix: ^3.16.13

flutter:
  generate: true
  uses-material-design: true
  # Only app-specific assets; the shared corpus is referenced as `packages/anthology/assets/...`.
  assets:
    - assets/documents/
    - assets/data/
    - assets/settings/
    - assets/settings/user_settings/
    - assets/licenses/

flutter_launcher_icons:
  android: true
  image_path: assets/icons/kataglyphis_app_icon.png
  web:
    generate: true
    image_path: assets/icons/kataglyphis_app_icon.png
    background_color: "#0B1220"
    theme_color: "#0B1220"
  windows:
    generate: true
    image_path: assets/icons/kataglyphis_app_icon.png
    icon_size: 256

msix_config:
  # Build-Windows.ps1 owns the build; msix only packages. See AGENTS.md § 5.
  build_windows: false
  display_name: OmniAccelerANT
  publisher_display_name: Kataglyphis
  identity_name: Kataglyphis.OmniAccelerANT
  msix_version: 2.2.1.0
  logo_path: assets/icons/kataglyphis_app_icon.png
